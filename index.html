/* =====================================================================
   10. v2 — PLACE DETAILS, THE CAPTURE BUTTON, THE CAMERA, THE CAPTURE FLOWS
   The app's big idea is ingestion → interpretation → implementation:
   things come in (camera, files, typing, voice, chat), something works out what they are,
   and they land in the right section. Until the AI layer is connected, "interpretation"
   is the small built-in sorter at the end of this section.
   ===================================================================== */

/* --- place details: the "bio" on an open card, from Google (Places API) — only for places picked from the suggestions --- */
const PLACE_TTL = 7 * 86400e3;                // a place's details are good for a week
const PLACE_FIELDS = 'displayName,formattedAddress,primaryTypeDisplayName,editorialSummary,regularOpeningHours,currentOpeningHours,nationalPhoneNumber,websiteUri,rating,userRatingCount,googleMapsUri';
function refreshPlace(placeId, force = false) {
  if (!gset.apiKey || !placeId) return Promise.resolve();
  gcache.places = gcache.places || {};
  const pl = gcache.places[placeId];
  if (!force && pl && pl.name && Date.now() - pl.at < PLACE_TTL) return Promise.resolve();
  if (!force && pl && pl.error && Date.now() - (pl.errorAt || 0) < ERROR_TTL) return Promise.resolve();
  const ik = 'place:' + placeId;
  if (inflight[ik]) return inflight[ik];
  inflight[ik] = (async () => {
    try {
      const d = await googleFetch(`https://places.googleapis.com/v1/places/${encodeURIComponent(placeId)}`, { headers: { 'X-Goog-Api-Key': gset.apiKey, 'X-Goog-FieldMask': PLACE_FIELDS } });
      gcache.places[placeId] = {
        at: Date.now(), name: (d.displayName && d.displayName.text) || '', address: d.formattedAddress || '',
        type: (d.primaryTypeDisplayName && d.primaryTypeDisplayName.text) || '', summary: (d.editorialSummary && d.editorialSummary.text) || '',
        hours: (d.regularOpeningHours && d.regularOpeningHours.weekdayDescriptions) || [], openNow: d.currentOpeningHours ? d.currentOpeningHours.openNow : null,
        phone: d.nationalPhoneNumber || '', website: d.websiteUri || '', rating: d.rating || null, ratings: d.userRatingCount || 0, mapsUrl: d.googleMapsUri || '', error: null,
      };
    } catch (e) {
      gcache.places[placeId] = { ...(pl || { at: 0 }), error: e.message, errorAt: Date.now() };
    }
    saveGoogleCache();
    delete inflight[ik];
    if (current === 'today' && expandedCardId) render();
  })();
  return inflight[ik];
}
function bioHtml(e) {
  if (!e.address) return '';
  if (!e.placeId) return `<div class="bio"><h4>About the place</h4><p>Pick the place from Google's suggestions (edit the event and retype the address) to see its hours, phone and description here.</p></div>`;
  if (!gset.apiKey) return '';
  const pl = (gcache.places || {})[e.placeId];
  if (!pl || (!pl.name && !pl.error)) return `<div class="bio"><h4>About the place</h4><p>Looking it up…</p></div>`;
  if (!pl.name) return `<div class="bio"><h4>About the place</h4><p>${esc(friendlyError(pl.error))}</p></div>`;
  const wd = WD[parseDT(e.date, e.time).getDay()];
  const dayHours = (pl.hours || []).find(h => h.toLowerCase().startsWith(wd.toLowerCase()));
  const hoursTxt = dayHours ? dayHours.replace(/^[A-Za-z]+:\s*/, '') : '';
  const facts = [
    pl.rating ? `<span>${icon('star')}${pl.rating} · ${pl.ratings.toLocaleString()} reviews</span>` : '',
    hoursTxt ? `<span title="Hours on ${wd}">${icon('clock')}${esc(hoursTxt)}${pl.openNow === true ? ' · open now' : pl.openNow === false ? ' · closed now' : ''}</span>` : '',
    pl.phone ? `<span>${icon('call')}<a href="tel:${esc(pl.phone.replace(/[^\d+]/g, ''))}">${esc(pl.phone)}</a></span>` : '',
    pl.website ? `<span>${icon('globe')}<a href="${esc(pl.website)}" target="_blank" rel="noopener">Website</a></span>` : '',
  ].filter(Boolean).join('');
  return `<div class="bio"><h4>${esc(pl.name)}${pl.type ? ` · ${esc(pl.type)}` : ''}</h4><p>${esc(pl.summary || pl.address || '')}</p>${facts ? `<div class="facts">${facts}</div>` : ''}</div>`;
}

/* --- the capture button: tap = camera, hold = the arc of other ways to add, drag onto one and let go --- */
const CAPTURE_OPTIONS = [
  { id: 'write', label: 'Write or paste', icon: 'pencil' },
  { id: 'files', label: 'Files', icon: 'file' },
  { id: 'voice', label: 'Voice', icon: 'mic' },
  { id: 'chat', label: 'Chat', icon: 'chat' },
];
function wireCaptureButton() {
  const btn = $('#capture'), arc = $('#arc');
  const HOLD_MS = 380, RADIUS = 108, SNAP = 48;
  let timer = null, held = false, open = false, pid = null, sx = 0, sy = 0, hot = null;
  const layout = () => {
    const b = btn.getBoundingClientRect(), cx = b.left + b.width / 2, cy = b.top + b.height / 2, n = CAPTURE_OPTIONS.length;
    arc.querySelectorAll('.opt').forEach(o => o.remove());
    CAPTURE_OPTIONS.forEach((o, i) => {
      const a = Math.PI * (160 - i * (140 / (n - 1))) / 180;             // fan from 160° (left) to 20° (right), over the button
      const el = document.createElement('div');
      el.className = 'opt'; el.dataset.id = o.id; el.setAttribute('role', 'menuitem');
      el.style.left = (cx + RADIUS * Math.cos(a)) + 'px'; el.style.top = (cy - RADIUS * Math.sin(a)) + 'px'; el.style.animationDelay = (i * 28) + 'ms';
      el.innerHTML = `<span class="lbl">${o.label}</span>${icon(o.icon)}`;
      arc.appendChild(el);
    });
  };
  const show = () => { open = true; layout(); arc.classList.add('open'); arc.setAttribute('aria-hidden', 'false'); $('#arcTip').textContent = 'Slide to an option and let go'; haptic(12); };
  const hide = () => { open = false; hot = null; arc.classList.remove('open'); arc.setAttribute('aria-hidden', 'true'); };
  const nearest = (x, y) => {
    let best = null, bd = Infinity;
    arc.querySelectorAll('.opt').forEach(o => { const r = o.getBoundingClientRect(); const d = Math.hypot(x - (r.left + r.width / 2), y - (r.top + r.height / 2)); if (d < bd) { bd = d; best = o; } });
    return bd <= SNAP ? best : null;
  };
  btn.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    e.preventDefault();
    pid = e.pointerId; sx = e.clientX; sy = e.clientY; held = false;
    try { btn.setPointerCapture(pid); } catch (err) {}
    btn.classList.add('held');
    timer = setTimeout(() => { held = true; show(); }, HOLD_MS);
  });
  btn.addEventListener('pointermove', e => {
    if (e.pointerId !== pid) return;
    if (!open) { if (!held && Math.hypot(e.clientX - sx, e.clientY - sy) > 14) { clearTimeout(timer); btn.classList.remove('held'); pid = null; } return; }
    const h = nearest(e.clientX, e.clientY);
    if (h !== hot) { hot = h; arc.querySelectorAll('.opt').forEach(o => o.classList.toggle('hot', o === h)); $('#arcTip').textContent = h ? '' : 'Slide to an option and let go'; if (h) haptic(5); }
  });
  const end = e => {
    if (e.pointerId !== pid) return;
    clearTimeout(timer); pid = null; btn.classList.remove('held');
    if (open) { const choice = hot ? hot.dataset.id : null; hide(); if (choice) openCaptureOption(choice); }
    else if (!held && e.type === 'pointerup') openCamera();
  };
  btn.addEventListener('pointerup', end);
  btn.addEventListener('pointercancel', end);
  btn.addEventListener('contextmenu', e => e.preventDefault());
  btn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openSheet('capture-menu'); } });   // keyboards get a plain menu
}
function openCaptureOption(id) {
  haptic(8);
  if (id === 'camera') return openCamera();
  openSheet(id);
}
// the same options as a plain list, for keyboards and for anyone who finds the hold gesture awkward
function captureMenuSheet() {
  const all = [{ id: 'camera', label: 'Camera', icon: 'camera' }, ...CAPTURE_OPTIONS];

/* --- the camera, inside the app --- */
let camStream = null, camFacing = 'environment';
async function openCamera() {
  const cam = $('#cam');
  cam.classList.add('open'); document.body.style.overflow = 'hidden';
  $('#camMsg').hidden = true; $('#camReticle').hidden = true; $('#camMode').textContent = 'Photo';
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return cameraFallback('This browser can’t show a live camera inside the app.');
  try {
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: camFacing, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    $('#camVideo').srcObject = camStream;
    try { if (!localStorage.getItem('familyhub.tip.hold')) { localStorage.setItem('familyhub.tip.hold', '1'); setTimeout(() => toast('Tip: hold the button and slide for more ways to add'), 900); } } catch (e) {}
  } catch (err) {
    cameraFallback(err && err.name === 'NotAllowedError' ? 'Camera permission was turned down. Allow it in the browser’s site settings, or use the phone’s own camera.' : 'Couldn’t start the camera here. You can use the phone’s own camera instead.');
  }
}
function cameraFallback(msg) {
  const m = $('#camMsg'); m.hidden = false;
  m.innerHTML = `<div><p>${esc(msg)}</p><button class="btn btn-primary" data-act="cam-fallback">Use the phone’s camera</button></div>`;
}
function closeCamera() {
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  $('#camVideo').srcObject = null;
  $('#cam').classList.remove('open'); document.body.style.overflow = '';
}
function flipCamera() { camFacing = camFacing === 'environment' ? 'user' : 'environment'; if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; } openCamera(); }
// Grab the current frame. "photo" keeps it as a picture; "lens" marks it to be read (text, dates, whatever's in view).
function takePhoto(mode) {
  const v = $('#camVideo');
  if (!camStream || !v.videoWidth) { $('#camFallback').dataset.mode = mode; $('#camFallback').click(); return; }
  const cam = $('#cam'); cam.classList.remove('flash'); void cam.offsetWidth; cam.classList.add('flash');
  haptic(10);
  const c = document.createElement('canvas'), scale = Math.min(1, 1280 / Math.max(v.videoWidth, v.videoHeight));
  c.width = Math.round(v.videoWidth * scale); c.height = Math.round(v.videoHeight * scale);
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  keepImage(c, mode);
}
// Shrink an image to a thumbnail the phone can afford to keep, and put it in the inbox.
function keepImage(source, mode, name) {
  const w = source.width || source.naturalWidth, h = source.height || source.naturalHeight;
  const scale = Math.min(1, 480 / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * scale)); c.height = Math.max(1, Math.round(h * scale));
  c.getContext('2d').drawImage(source, 0, 0, c.width, c.height);
  const thumb = c.toDataURL('image/jpeg', 0.72);
  addCapture({ type: 'photo', mode: mode || 'photo', thumb, name: name || '' });
  closeCamera();
  toast(mode === 'lens' ? 'Lens capture kept in the inbox — the reader is the next stage' : 'Photo kept in the inbox');
  openSheet('inbox');
}
$('#camFallback').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const img = new Image(); img.onload = () => { keepImage(img, e.target.dataset.mode || 'photo', f.name); URL.revokeObjectURL(img.src); };
  img.src = URL.createObjectURL(f); e.target.value = '';
});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act="cam-fallback"], [data-act="open-capture"]');
  if (!el) return;
  if (el.dataset.act === 'cam-fallback') $('#camFallback').click();
  else { closeSheet(); setTimeout(() => openCaptureOption(el.dataset.id), 200); }
});

/* --- the inbox: everything captured waits here until it's sorted --- */
const INBOX_MAX = 40;
let pendingCaptureId = null;                   // the capture a sheet was opened from — removed when that sheet saves
function addCapture(c) {
  state.captures = state.captures || [];
  state.captures.unshift({ id: uid(), at: Date.now(), ...c });
  if (state.captures.length > INBOX_MAX) state.captures.length = INBOX_MAX;
  save(); render();
}
function captureTitle(c) {
  if (c.type === 'photo') return c.mode === 'lens' ? 'Lens capture' : 'Photo';
  if (c.type === 'file') return c.name || 'File';
  return (c.text || '').split('\n')[0].slice(0, 80) || 'Note';
}
function inboxSheet() {
  const list = state.captures || [];
  if (!list.length) return `<h2 id="sheetTitle">Inbox</h2>${emptyState({ glyph: 'inbox', title: 'Nothing waiting', body: 'Photos, files and notes you capture land here until they’re sorted into the right place.', quiet: true })}`;
  const rows = list.map(c => {
    const lead = c.type === 'photo' ? `<img class="thumb" src="${c.thumb}" alt="">` : c.type === 'file' ? (c.thumb ? `<img class="thumb" src="${c.thumb}" alt="">` : `<span class="ico">${icon('file')}</span>`) : `<span class="ico">${icon(c.type === 'voice' ? 'mic' : 'pencil')}</span>`;
    const sub = c.type === 'photo' ? (c.mode === 'lens' ? 'Waiting for the reader (AI layer)' : 'Kept as a picture') : c.type === 'file' ? `${c.kind || 'File'}${c.size ? ' · ' + fileSize(c.size) : ''}` : (c.text || '').length > 80 ? (c.text || '').slice(80, 200) : '';
    const acts = (c.type === 'text' || c.type === 'voice')
      ? `<button class="go" data-act="cap-sort" data-id="${c.id}" data-to="auto">Sort it</button><button data-act="cap-sort" data-id="${c.id}" data-to="event">Event</button><button data-act="cap-sort" data-id="${c.id}" data-to="chore">Chore</button><button data-act="cap-sort" data-id="${c.id}" data-to="grocery">Grocery</button><button data-act="cap-sort" data-id="${c.id}" data-to="note">Note</button>`
      : `<button data-act="cap-sort" data-id="${c.id}" data-to="note">Make a note</button>`;
    return `<div class="cap" data-id="${c.id}">${lead}<div class="grow"><div class="t">${esc(captureTitle(c))}</div><div class="s">${esc(sub)}${sub ? ' · ' : ''}${ago(c.at)}</div><div class="acts">${acts}<button data-act="cap-delete" data-id="${c.id}">Delete</button></div></div></div>`;
  }).join('');
  return `<h2 id="sheetTitle">Inbox</h2><p class="hint" style="margin-bottom:10px">${list.length} waiting. Photos and files will be read by the AI layer; text you can sort now.</p><div class="stack">${rows}</div>`;
}
function fileSize(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : n > 1024 ? Math.round(n / 1024) + ' KB' : n + ' B'; }
// "Sort it" on a capture: work out what it is (or take the kind the person chose) and open the right form, filled in.
function sortCapture(id, to) {
  const c = (state.captures || []).find(x => x.id === id); if (!c) return;
  pendingCaptureId = id;
  if (c.type === 'photo' || c.type === 'file') { closeSheet(); setTimeout(() => openSheet('note', null, { text: `${captureTitle(c)} captured ${longDate(isoDate(new Date(c.at)))}` }), 220); return; }
  const prop = interpret(c.text || '', { force: to === 'auto' ? null : to });
  closeSheet();
  setTimeout(() => openProposalSheet(prop), 220);
}

/* --- the capture sheets: write or paste, files, voice, chat --- */
function writeSheet(presets = {}) {
  return `<h2 id="sheetTitle">Write or paste</h2>
    <div class="field"><textarea id="capText" placeholder="Soccer Tuesday 5:30 at Lakeshore Park · buy milk and eggs · remind Theo to take out the trash Friday" maxlength="2000">${esc(presets.text || '')}</textarea></div>
    <div id="capProposal"></div>
    <div class="actions"><button type="button" class="btn btn-ghost" data-act="write-keep">Keep in inbox</button><button type="button" class="btn btn-primary" data-act="write-sort">Sort it</button></div>
    <p class="hint" style="margin-top:10px">“Sort it” reads the text for a day, a time, a place and words like <i>buy</i> or <i>remind</i>, then proposes where it goes. You can change its mind before anything is added.</p>`;
}
function writeSort() {
  const text = ($('#capText') || {}).value || '';
  if (!text.trim()) return;
  const prop = interpret(text, { bias: sectionBias() });
  $('#capProposal').innerHTML = proposalHtml(prop);
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act="write-keep"]'); if (!el) return;
  const text = ($('#capText') || {}).value || ''; if (!text.trim()) return;
  addCapture({ type: 'text', text: text.trim() }); closeSheet(); toast('Kept in the inbox');
});
function filesSheet() {
  return `<h2 id="sheetTitle">Files</h2>
    <div class="filepick">
      <label>${icon('file')}Documents &amp; more<input type="file" id="filePick" multiple accept="image/*,application/pdf,audio/*,video/*,.doc,.docx,.xls,.xlsx,.csv,.txt,.md,.pages,.numbers"></label>
      <label>${icon('image')}Photo library<input type="file" id="photoPick" multiple accept="image/*"></label>
    </div>
    <p class="hint" style="margin-top:12px">Pictures keep a small copy in the inbox. Other files are noted by name for now — the AI layer will read PDFs, audio and documents when it’s connected.</p>`;
}
function wireFilesSheet(root) {
  root.querySelectorAll('input[type=file]').forEach(inp => inp.addEventListener('change', async e => {
    const files = [...(e.target.files || [])]; if (!files.length) return;
    for (const f of files) {
      if (f.type.startsWith('image/')) {
        await new Promise(res => { const img = new Image(); img.onload = () => { keepImageQuiet(img, f.name); URL.revokeObjectURL(img.src); res(); }; img.onerror = res; img.src = URL.createObjectURL(f); });
      } else {
        addCapture({ type: 'file', name: f.name, kind: fileKind(f), size: f.size });
      }
    }
    closeSheet(); toast(`${files.length} file${files.length === 1 ? '' : 's'} kept in the inbox`); setTimeout(() => openSheet('inbox'), 260);
  }));
}
function keepImageQuiet(img, name) {
  const scale = Math.min(1, 480 / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.naturalWidth * scale)); c.height = Math.max(1, Math.round(img.naturalHeight * scale));
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  addCapture({ type: 'file', name, kind: 'Picture', thumb: c.toDataURL('image/jpeg', 0.72) });
}
function fileKind(f) { const t = f.type || ''; return t.includes('pdf') ? 'PDF' : t.startsWith('audio/') ? 'Audio' : t.startsWith('video/') ? 'Video' : /sheet|excel|csv/.test(t) ? 'Spreadsheet' : /word|document|text/.test(t) ? 'Document' : 'File'; }

// voice: the browser's own speech recognition (works online; Safari and Chrome have it)
let recog = null, listening = false, transcript = '';
function voiceSheet() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return `<h2 id="sheetTitle">Voice</h2><p class="hint">This browser can’t turn speech into text. On an iPhone, the keyboard’s microphone key does the same job — open <b>Write or paste</b> and tap it.</p><div class="actions"><button type="button" class="btn btn-primary" data-act="open-capture" data-id="write">Write or paste</button></div>`;
  transcript = '';
  return `<h2 id="sheetTitle">Voice</h2>
    <div class="listen" id="listen"><button type="button" class="orb" data-act="voice-toggle" aria-label="Start listening">${icon('mic')}</button><div class="live" id="liveText">Tap the microphone and say what to add</div></div>
    <div class="actions"><button type="button" class="btn btn-ghost" data-act="sheet-close">Cancel</button><button type="button" class="btn btn-primary" data-act="voice-use" id="voiceUse" disabled>Use this</button></div>`;
}
function toggleListening() { if (listening) stopListening(); else startListening(); }
function startListening() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR) return;
  recog = new SR(); recog.lang = navigator.language || 'en-US'; recog.interimResults = true; recog.continuous = true;
  let finalText = transcript;
  recog.onresult = ev => {
    let interim = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) { const r = ev.results[i]; if (r.isFinal) finalText += (finalText ? ' ' : '') + r[0].transcript.trim(); else interim += r[0].transcript; }
    transcript = finalText;
    const live = $('#liveText'); if (live) live.textContent = (finalText + ' ' + interim).trim() || 'Listening…';
    const use = $('#voiceUse'); if (use) use.disabled = !(finalText + interim).trim();
  };
  recog.onerror = ev => { const live = $('#liveText'); if (live) live.textContent = ev.error === 'not-allowed' ? 'Microphone permission was turned down — allow it in the browser’s site settings.' : 'Didn’t catch that — tap to try again.'; stopListening(); };
  recog.onend = () => { if (listening) { listening = false; const l = $('#listen'); if (l) l.classList.remove('on'); } };
  try { recog.start(); listening = true; const l = $('#listen'); if (l) l.classList.add('on'); const live = $('#liveText'); if (live) live.textContent = 'Listening…'; haptic(8); } catch (e) {}
}
function stopListening() { if (recog) { try { recog.stop(); } catch (e) {} } listening = false; const l = $('#listen'); if (l) l.classList.remove('on'); }
function useTranscript() {
  const text = transcript.trim() || (($('#liveText') || {}).textContent || '').trim();
  if (!text || /^(Listening|Tap the microphone)/.test(text)) return;
  stopListening();
  const prop = interpret(text, { bias: sectionBias() });
  closeSheet(); setTimeout(() => openProposalSheet(prop, { fromVoice: true }), 220);
}

// chat: a small assistant for the section you're on — it proposes, you confirm
let chatLog = [];
function chatSheet() {
  const where = { calendar: 'the calendar', lists: listsMode === 'grocery' ? 'the grocery list' : 'the chores', board: 'the board', today: 'today' }[current] || 'the app';
  chatLog = [{ me: false, text: `I’m the helper for ${where}. Tell me what to add — “soccer Tuesday 5:30 at Lakeshore Park”, “buy milk and eggs”, “remind Theo to take out the trash Friday” — and I’ll put it in the right place.` }];
  return `<h2 id="sheetTitle">Chat</h2><div class="chat" id="chatLog">${chatLog.map(chatBubble).join('')}</div>
    <div class="chatrow"><input type="text" id="chatInput" placeholder="What should I add?" maxlength="500" autocomplete="off" enterkeyhint="send"><button type="button" data-act="chat-send" aria-label="Send">${icon('send')}</button></div>
    <p class="hint" style="margin-top:8px">Built-in sorter for now; the AI assistant plugs in here in the next stage.</p>`;
}
function chatBubble(m) { return `<div class="m ${m.me ? 'me' : 'bot'}">${m.html || esc(m.text)}</div>`; }
function wireChatSheet(root) {
  const inp = root.querySelector('#chatInput');
  if (inp) inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); chatSend(); } });
}
function chatSend() {
  const inp = $('#chatInput'); const text = (inp && inp.value || '').trim(); if (!text) return;
  inp.value = '';
  chatLog.push({ me: true, text });
  const prop = interpret(text, { bias: sectionBias() });
  const reply = prop ? { me: false, html: `${esc(proposalWords(prop))}${proposalActions(prop)}` } : { me: false, text: 'I didn’t catch a day, a time or a keyword like “buy”. Try “…on Friday at 6” or “buy …”, or I can keep it as a note.' };
  chatLog.push(reply);
  const log = $('#chatLog'); if (log) { log.innerHTML = chatLog.map(chatBubble).join(''); log.scrollTop = log.scrollHeight; }
}
function sectionBias() { return current === 'calendar' ? 'event' : current === 'board' ? 'note' : current === 'lists' ? (listsMode === 'grocery' ? 'grocery' : 'chore') : null; }

/* --- proposals: what the sorter thinks, shown with an Add button --- */
const proposals = {};
function proposalHtml(prop) {
  if (!prop) return `<div class="proposal">I didn’t catch a day, a time or a keyword like “buy”. Add it as a note, or say when it is.<div class="acts"><button type="button" class="btn btn-ghost btn-sm" data-act="cap-edit" data-pid="${keepProposal({ kind: 'note', text: ($('#capText') || {}).value || '' })}">Make it a note</button></div></div>`;
  return `<div class="proposal">${esc(proposalWords(prop))}${proposalActions(prop)}</div>`;
}
function keepProposal(p) { const id = uid(); proposals[id] = p; return id; }
function proposalWords(p) {
  const who = (p.who || []).map(id => member(id) && member(id).name).filter(Boolean).join(', ');
  if (p.kind === 'event') return `Looks like an event: “${p.title}” on ${longDate(p.date)}${p.time ? ' at ' + timeLabel(p.time) : ''}${p.where ? ' at ' + p.where : ''}${who ? ' for ' + who : ''}. ${p.why || ''}`.trim();
  if (p.kind === 'chore') return `Looks like a chore: “${p.title}”${who ? ' for ' + who : ''}, due ${dayLabel(p.due)}${p.repeat && p.repeat !== 'none' ? ` (${p.repeat})` : ''}. ${p.why || ''}`.trim();
  if (p.kind === 'grocery') return `Grocery list: ${p.items.map(i => '“' + i.name + (i.qty ? ' · ' + i.qty : '') + '”').join(', ')}. ${p.why || ''}`.trim();
  return `I’ll keep this as a note on the board: “${(p.text || '').slice(0, 80)}${(p.text || '').length > 80 ? '…' : ''}”. ${p.why || ''}`.trim();
}
function proposalActions(p) {
  const pid = keepProposal(p);
  const others = ['event', 'chore', 'grocery', 'note'].filter(k => k !== p.kind);
  return `<div class="acts"><button type="button" class="go" data-act="cap-apply" data-pid="${pid}">Add it</button><button type="button" data-act="cap-edit" data-pid="${pid}">Edit first</button>${others.map(k => `<button type="button" data-act="cap-edit" data-pid="${keepProposal(interpretAs(p, k))}">${{ event: 'Event', chore: 'Chore', grocery: 'Grocery', note: 'Note' }[k]}…</button>`).join('')}</div>`;
}
function openProposalSheet(prop, opts = {}) {
  openSheet('write', { text: prop ? prop.source : '' });
  setTimeout(() => { const box = $('#capProposal'); if (box) box.innerHTML = proposalHtml(prop); }, 30);
}
function applyProposal(pid) {
  const p = proposals[pid]; if (!p) return;
  const before = snapshot();
  if (p.kind === 'event') state.events.push({ id: uid(), title: p.title, date: p.date, time: p.time || '18:00', who: p.who || [], where: p.where || '', address: p.address || '' });
  else if (p.kind === 'chore') state.chores.push({ id: uid(), title: p.title, who: (p.who || [])[0] || state.members[0]?.id || '', due: p.due, repeat: p.repeat || 'none', done: false });
  else if (p.kind === 'grocery') p.items.forEach(i => state.grocery.unshift({ id: uid(), name: i.name, qty: i.qty || '', done: false }));
  else state.notes.unshift({ id: uid(), text: p.text, who: (p.who || [])[0] || state.members[0]?.id || '', color: NOTE_COLORS[state.notes.length % NOTE_COLORS.length], at: Date.now(), pinned: false });
  if (pendingCaptureId) { state.captures = state.captures.filter(c => c.id !== pendingCaptureId); pendingCaptureId = null; }
  save(); haptic(12); closeSheet(); render();
  toast({ event: 'Event added', chore: 'Chore added', grocery: 'Added to the grocery list', note: 'Note posted' }[p.kind], () => restore(before));
}
function editProposal(pid) {
  const p = proposals[pid]; if (!p) return;
  closeSheet();
  setTimeout(() => {
    if (p.kind === 'event') openSheet('event', null, { title: p.title, date: p.date, time: p.time || '18:00', who: p.who || [], where: p.where || '', address: p.address || '' });
    else if (p.kind === 'chore') openSheet('chore', null, { title: p.title, who: (p.who || [])[0] || '', due: p.due, repeat: p.repeat || 'none' });
    else if (p.kind === 'grocery') { p.items.forEach(i => state.grocery.unshift({ id: uid(), name: i.name, qty: i.qty || '', done: false })); if (pendingCaptureId) { state.captures = state.captures.filter(c => c.id !== pendingCaptureId); pendingCaptureId = null; } save(); listsMode = 'grocery'; setTab('lists'); toast('Added — edit them in the list'); }
    else openSheet('note', null, { text: p.text || '', who: (p.who || [])[0] || '' });
  }, 220);
}
// the fields a form can be opened with (from a proposal or a capture)
function presetFields(presets) {
  const out = {};
  ['title', 'time', 'where', 'address', 'who', 'due', 'repeat', 'text'].forEach(k => { if (presets && presets[k] !== undefined && presets[k] !== null && presets[k] !== '') out[k] = presets[k]; });
  return out;
}

/* --- the built-in sorter (interpretation, until the AI layer takes over) ---
   Reads one message for: who it mentions, a day, a time, a place, and words that mark a chore or a shopping item.
   Returns a proposal { kind, ... , why, source } or null when it can't tell. --- */
const WD_RE = '(sunday|monday|tuesday|wednesday|thursday|friday|saturday|sun|mon|tue|tues|wed|thu|thur|thurs|fri|sat)';
const MO_RE = '(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\\.?';
const escapeRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function interpret(text, { force = null, bias = null } = {}) {
  const source = String(text || '').trim();
  if (!source) return null;
  let work = ' ' + source + ' ';
  const lower = () => work.toLowerCase();
  const t = today();
  const found = { date: null, time: null, where: '', who: [], repeat: 'none' };
  const cut = (re) => { const m = work.match(re); if (m) { work = work.replace(m[0], ' '); } return m; };

  // people
  state.members.forEach(m => { if (m.name && new RegExp(`\\b${escapeRe(m.name)}(?:'s|’s)?\\b`, 'i').test(work)) { found.who.push(m.id); work = work.replace(new RegExp(`\\b${escapeRe(m.name)}(?:'s|’s)?\\b`, 'ig'), ' '); } });
  // repeats
  if (cut(/\b(every day|daily)\b/i)) found.repeat = 'daily';
  else if (cut(/\b(every week|weekly)\b/i)) found.repeat = 'weekly';
  else if (/\bevery\s+/i.test(work) && new RegExp(`\\bevery\\s+${WD_RE}\\b`, 'i').test(work)) { found.repeat = 'weekly'; work = work.replace(/\bevery\s+/i, ' '); }
  // day
  let m;
  if (cut(/\b(day after tomorrow)\b/i)) found.date = isoDate(addDays(t, 2));
  else if (cut(/\b(tomorrow|tmrw)\b/i)) found.date = isoDate(addDays(t, 1));
  else if (cut(/\b(tonight|today)\b/i)) { found.date = isoDate(t); }
  else if ((m = cut(new RegExp(`\\b(next\\s+)?${WD_RE}\\b`, 'i')))) {
    const names = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
    const want = names.indexOf(m[2].slice(0, 3).toLowerCase());
    let d = new Date(t); let diff = (want - d.getDay() + 7) % 7; if (diff === 0 && !m[1]) diff = 0; if (m[1] && diff === 0) diff = 7;
    d = addDays(d, diff); found.date = isoDate(d);
  }
  else if ((m = cut(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/))) {
    const y = m[3] ? (m[3].length === 2 ? 2000 + Number(m[3]) : Number(m[3])) : t.getFullYear();
    let d = new Date(y, Number(m[1]) - 1, Number(m[2])); if (!m[3] && d < t) d = new Date(y + 1, Number(m[1]) - 1, Number(m[2]));
    found.date = isoDate(d);
  }
  else if ((m = cut(new RegExp(`\\b${MO_RE}\\s+(\\d{1,2})(?:st|nd|rd|th)?\\b`, 'i')) || cut(new RegExp(`\\b(\\d{1,2})(?:st|nd|rd|th)?\\s+(?:of\\s+)?${MO_RE}\\b`, 'i')))) {
    const mo = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
    const mi = mo.indexOf((m[1].length <= 2 ? m[2] : m[1]).slice(0, 3).toLowerCase()), day = Number(m[1].length <= 2 ? m[1] : m[2]);
    let d = new Date(t.getFullYear(), mi, day); if (d < t) d = new Date(t.getFullYear() + 1, mi, day);
    found.date = isoDate(d);
  }
  // time
  if ((m = cut(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm|a\.m\.|p\.m\.)\b/i))) {
    let h = Number(m[1]) % 12; if (/p/i.test(m[3])) h += 12; found.time = `${pad(h)}:${pad(Number(m[2] || 0))}`;
  } else if ((m = cut(/\b(\d{1,2}):(\d{2})\b/))) {
    let h = Number(m[1]); if (h >= 1 && h <= 7) h += 12;             // "5:30" with no am/pm: the afternoon, in a family app
    found.time = `${pad(h)}:${m[2]}`;
  } else if ((m = cut(/\b(?:at|@)\s+(\d{1,2})\b/))) {
    let h = Number(m[1]); if (h >= 1 && h <= 7) h += 12;             // "at 5" in a family app means 5 in the afternoon
    found.time = `${pad(h)}:00`;
  } else if (cut(/\bnoon\b/i)) found.time = '12:00';
  else if (cut(/\bmidnight\b/i)) found.time = '00:00';
  else if (cut(/\b(in the )?morning\b/i)) found.time = '09:00';
  else if (cut(/\b(in the )?afternoon\b/i)) found.time = '15:00';
  else if (cut(/\b(in the )?evening\b/i)) found.time = '19:00';
  if (/tonight/i.test(source) && !found.time) found.time = '19:00';
  // place: "at Lakeshore Park", "@ Dr. Patel's", "in the gym"
  if ((m = cut(/(?:\bat|@)\s+((?:the\s+)?[A-Z][\w'’&.-]*(?:\s+(?:[A-Z][\w'’&.-]*|of|the|and|&))*)/))) found.where = m[1].trim();
  else if ((m = cut(/\bat\s+(?:the\s+)?([a-z][\w'’&.-]*(?:\s+[a-z][\w'’&.-]*){0,3}?)(?=\s*(?:$|,|\.|\bon\b|\bfor\b))/i))) found.where = m[1].trim();

  // what kind of thing is it?
  const L = lower();
  const groceryWords = /\b(buy|need to get|need|we're out of|we are out of|out of|pick up|grab|grocery|groceries|shopping list)\b/;
  const choreWords = /\b(chore|remind|reminder|take out|take the|clean|mow|wash|fold|vacuum|dishes|dishwasher|trash|recycling|laundry|water the|feed the|walk the|tidy|sweep|homework)\b/;
  let kind = force;
  if (!kind) {
    if (groceryWords.test(L) && !found.time) kind = 'grocery';
    else if (choreWords.test(L) && !found.time) kind = 'chore';
    else if (found.date || found.time) kind = 'event';
    else if (bias === 'grocery' && !/\bon\b/.test(L)) kind = 'grocery';
    else if (bias) kind = bias;
    else if (groceryWords.test(L)) kind = 'grocery';
    else if (choreWords.test(L)) kind = 'chore';
    else return null;
  }
  // the title = what's left after the day, time, place and people are taken out
  let title = work.replace(/\b(add|schedule|put|create|new|please|remind me to|remind|reminder|to do|todo|event|appointment|on|for|at|the)\b/gi, m => (/^(add|schedule|put|create|new|please|remind me to|remind|reminder)$/i.test(m) ? ' ' : m)).replace(/\s+/g, ' ').replace(/^[\s,.:;-]+|[\s,.:;-]+$/g, '').trim();
  title = title.replace(/\s+,/g, ',').replace(/\s+/g, ' ').trim();
  for (let guard = 0; guard < 4; guard++) title = title.replace(/^(on|at|for|the|to|a|an|and|with|is)\s+/i, '').replace(/\s+(on|at|for|the|to|a|an|and|with|is|in)$/i, '').replace(/[,\s]+$/, '').trim();
  if (!title) title = found.where ? `At ${found.where}` : (kind === 'event' ? 'Event' : kind === 'chore' ? 'Chore' : 'Note');
  title = title.charAt(0).toUpperCase() + title.slice(1);

  if (kind === 'grocery') {
    const list = source.replace(groceryWords, ' ').replace(/\b(some|a few|and)\b/gi, ',').split(/[,;\n]+|\bthen\b/i).map(x => x.trim().replace(/^(of|to|the)\s+/i, '')).filter(Boolean);
    const items = list.map(x => { const q = x.match(/^(\d+(?:\.\d+)?\s*(?:lb|lbs|oz|kg|g|doz|dozen|pack|packs|gal|gallon|gallons|x)?)\s+(.+)$/i); return q ? { name: q[2].trim(), qty: q[1].trim() } : { name: x.replace(/^\d+\s*x?\s*/, '') || x, qty: (x.match(/^(\d+)\s/) || [])[1] || '' }; }).filter(i => i.name);
    if (!items.length) return null;
    return { kind, items, why: 'It says buy / need / out of.', source, who: found.who };
  }
  if (kind === 'chore') {
    return { kind, title, who: found.who, due: found.date || isoDate(t), repeat: found.repeat, why: found.date ? 'It sounds like a job with a day.' : 'It sounds like a job — due today unless you change it.', source };
  }
  if (kind === 'event') {
    return { kind, title, date: found.date || isoDate(t), time: found.time || '', where: found.where, who: found.who, why: found.date && found.time ? 'It has a day and a time.' : found.date ? 'It has a day.' : 'It has a time, so I assumed today.', source };
  }
  return { kind: 'note', text: source, who: found.who, why: 'No day, time or list words — so a note.', source };
}
// the same message, re-read as a different kind (for the “Chore…”, “Note…” buttons)
function interpretAs(p, kind) { return interpret(p.source || p.text || p.title || '', { force: kind }) || { kind: 'note', text: p.source || '', source: p.source || '' }; }

/* ---------- 9. BOOT ---------- */
document.querySelectorAll('.tab[data-tab]').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
wireCaptureButton();
importSetupFromUrl();
openingT0 = Date.now();   // the sky plays its opening on the first draw
render();
</script>
