// "The Riveras" → "Riveras", so the greeting reads "Good morning, Riveras".
function familyShort() { return (state.familyName || '').trim().replace(/^the\s+/i, ''); }
// Which part of the day it is, from Google's sunrise and sunset for today when we have them (6:45 and 7:30 otherwise).
let skyShown = '';
function skyPeriod(now = new Date()) {
  const w = gcache.weather, d0 = w && w.days && w.days.find(d => d.date === isoDate(now));
  let rise = d0 && d0.sunrise ? Date.parse(d0.sunrise) : NaN, set = d0 && d0.sunset ? Date.parse(d0.sunset) : NaN;
  if (!(rise > 0) || !(set > 0)) {
    rise = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 6, 45).getTime();
    set = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 19, 30).getTime();
  }
  const ms = now.getTime(), H = 3600e3;
  if (ms < rise - H || ms > set + H) return 'night';
  if (ms < rise + 0.75 * H) return 'dawn';
  if (ms > set - H) return 'dusk';
  return 'day';
}
// Google's ~40 condition words folded into the seven skies we can draw.
function skyKind(type) {
  const t = type || '';
  if (/THUNDER/.test(t)) return 'storm';
  if (/SNOW|HAIL|SLEET|BLOWING|ICE/.test(t)) return 'snow';
  if (/RAIN|SHOWER|DRIZZLE/.test(t)) return 'rain';
  if (t === 'WINDY') return 'wind';
  if (t === 'CLOUDY' || t === 'MOSTLY_CLOUDY') return 'cloudy';
  if (t === 'PARTLY_CLOUDY') return 'partly';
  return 'clear';
}
// The eight stars of the sky, each its own point (--i is its place in the line-up, --s its size).
const STARS = [[0, 1.6, 12, 14], [1, 1.2, 28, 32], [2, 1.8, 44, 9], [3, 1.2, 63, 26], [4, 1.5, 82, 40], [5, 1.2, 91, 12], [6, 1.4, 20, 52], [7, 1.2, 55, 46]]
  .map(([i, s, x, y]) => `<i class="st" style="--i:${i};--s:${s}px;left:${x}%;top:${y}%"></i>`).join('');
// The opening: how the sky's parts arrive when the app opens. The picks follow the data — the sun rises at dawn and sinks at dusk,
// the moon rises at night with the stars coming out one by one, clouds drift or roll in, rain falls, snow flurries, a storm flashes once —
// so the first second tells you what the sky is doing right now. (The choices come from the Sky Openings page; Alex asked for data-led picks.)
const OPENING = {
  f: .75, td: 120,                                                          // "Together" timing: everything at once, done in about a second
  sky: 'fade', text: 'rise',
  orb: { dawn: 'rise', day: 'bloom', dusk: 'dip', night: 'moonrise' },
  stars: { rise: 'fade', bloom: 'fade', dip: 'late', moonrise: 'sprinkle' },   // the stars follow the sun or moon: first stars at dusk, one by one at night
  wx: { clear: 'none', partly: 'driftin', cloudy: 'thicken', wind: 'gust', rain: 'downpour', snow: 'flurry', storm: 'flash' },
};
const OPENING_MS = 2200;      // the longest opening (a snow flurry) is over by then
let openingT0 = 0;            // when the current opening started (0 = none playing)
function opening(period, kind) {
  const el = openingT0 ? Date.now() - openingT0 : Infinity;
  if (el > OPENING_MS || matchMedia('(prefers-reduced-motion: reduce)').matches) return null;
  const orb = OPENING.orb[period] || 'bloom', wx = OPENING.wx[kind] || 'none';
  const td = wx === 'flash' ? Math.max(OPENING.td, 900) : OPENING.td;     // in a storm the words wait for the lightning
  return {
    sky: ` go o-sky-${OPENING.sky} o-orb-${orb} o-stars-${OPENING.stars[orb]} o-wx-${wx}`,
    hero: ` go o-text-${OPENING.text}`,
    style: ` style="--f:${OPENING.f};--td:${Math.round(td * OPENING.f)}ms;--el:-${el}ms"`,   // a redraw mid-opening carries on from where it was
  };
}
// The scene tile: a little square of the same sky, with the sun or moon where it really is, and whatever is falling.
function sceneSvg(type, isDay = true, period = skyPeriod()) {
  const kind = skyKind(type);
  const night = period === 'night' || (isDay === false && period !== 'day');
  const sunAt = { dawn: [22, 42], day: [42, 20], dusk: [42, 42], night: [42, 20] }[period] || [42, 20];
  const [sx, sy] = sunAt;
  const uid = 'sc' + Math.random().toString(36).slice(2, 7);
  const dim = kind === 'cloudy' || kind === 'rain' || kind === 'snow' || kind === 'storm';
  // the sun (with slow rays when the sky is clear) or the moon (a disc with a bite out of it)
  let light = '';
  if (night) {
    light = `<g class="sc-moon" opacity="${dim ? .55 : 1}"><mask id="${uid}m"><rect width="64" height="64" fill="#fff"/><circle cx="${sx + 6}" cy="${sy - 5}" r="8" fill="#000"/></mask><circle cx="${sx}" cy="${sy}" r="9" fill="#F6F3E4" mask="url(#${uid}m)"/></g>`
      + (dim ? '' : `<g class="sc-stars"><circle class="sc-star" cx="14" cy="14" r="1.2" fill="#fff"/><circle class="sc-star" cx="24" cy="30" r=".9" fill="#fff" style="animation-delay:-1s"/><circle class="sc-star" cx="54" cy="36" r="1" fill="#fff" style="animation-delay:-2s"/></g>`);
  } else {
    const rays = kind === 'clear' ? `<g class="sc-rays" stroke="#FFE08A" stroke-width="2" stroke-linecap="round" opacity=".9">${[0, 45, 90, 135, 180, 225, 270, 315].map(a => `<line x1="${sx}" y1="${sy - 13}" x2="${sx}" y2="${sy - 17}" transform="rotate(${a} ${sx} ${sy})"/>`).join('')}</g>` : '';
    light = `<g class="sc-sun" opacity="${dim ? .5 : 1}">${dim ? '' : `<circle cx="${sx}" cy="${sy}" r="16" fill="#FFD466" opacity=".28"/>`}<circle cx="${sx}" cy="${sy}" r="9" fill="#FFD466"/></g>${rays}`;
  }
  // clouds: one for partly, two for the rest; grey when they carry rain or thunder
  const cloudFill = kind === 'rain' || kind === 'storm' ? '#8F9BB0' : kind === 'snow' ? '#E4E9F2' : '#FFFFFF';
  // (the placing transform sits on an outer group, so the drift animation on the inner one doesn't overwrite it)
  const cloud = (x, y, s, cls) => `<g transform="translate(${x} ${y}) scale(${s})"><g class="sc-cloud ${cls}" fill="${cloudFill}" opacity=".95"><circle cx="10" cy="10" r="8"/><circle cx="20" cy="6" r="10"/><circle cx="30" cy="11" r="7"/><rect x="2" y="10" width="35" height="9" rx="4.5"/></g></g>`;
  let clouds = '';
  if (kind === 'partly') clouds = cloud(22, 30, 1, 'a');
  else if (kind === 'wind') clouds = cloud(8, 14, .75, 'a');
  else if (dim) clouds = cloud(4, 18, .8, 'b') + cloud(20, 26, 1, 'a');
  // what falls out of them
  let falling = '';
  if (kind === 'rain' || kind === 'storm') falling = `<g class="sc-rain" stroke="#7FB0F5" stroke-width="2" stroke-linecap="round">${[26, 34, 42, 50].map((x, i) => `<line class="sc-drop" x1="${x}" y1="48" x2="${x - 2}" y2="54" style="animation-delay:${-i * .28}s"/>`).join('')}</g>`;
  if (kind === 'snow') falling = `<g class="sc-snow" fill="#FFFFFF">${[26, 34, 42, 50].map((x, i) => `<circle class="sc-flake" cx="${x}" cy="51" r="1.8" style="animation-delay:${-i * .7}s"/>`).join('')}</g>`;
  if (kind === 'storm') falling += `<polygon class="sc-bolt" points="38,38 31,50 36,50 33,60 44,45 38,45 41,38" fill="#FFD23F"/>`;
  if (kind === 'wind') falling = `<g class="sc-wind" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity=".9"><path class="sc-gust" d="M8 36h30a5 5 0 1 0-5-5"/><path class="sc-gust" d="M14 46h22a4 4 0 1 1-4 4" style="animation-delay:-.8s"/></g>`;
  return `<svg viewBox="0 0 64 64" aria-hidden="true">${light}${clouds}${falling}</svg>`;
}
// Events for the card stack: anything that hasn't finished (an event counts for an hour after it starts), soonest first.
function upcomingForCards() {
  const cutoff = Date.now() - 3600e3;
  const list = sortedEvents().filter(e => e.at.getTime() > cutoff).slice(0, 8);
  const pi = list.findIndex(e => e.id === state.featuredEventId);
  if (pi > 0) list.unshift(list.splice(pi, 1)[0]);
  return list;
}
// "1d 12h" for a nested card's corner; the open card gets the full four-number countdown instead.
function soonLabel(ms) {
  if (ms <= 0) return 'now';
  const d = Math.floor(ms / 86400e3), h = Math.floor(ms % 86400e3 / 3600e3), m = Math.floor(ms % 3600e3 / 60e3);
  return d > 0 ? `${d}d ${h}h` : h > 0 ? `${h}h ${m}m` : `${Math.max(1, m)}m`;
}
function cardHtml(e, i) {
  const tone = (i % 5) + 1;                            // cards cycle through five colors
  const open = e.id === expandedCardId;
  const pinned = e.id === state.featuredEventId;
  const at = e.at.getTime(), ms = at - Date.now();
  const when = `${longDate(e.date)} · ${timeLabel(e.time)}${e.where ? ` · ${esc(e.where)}` : ''}`;
  const eyebrow = pinned ? 'Pinned' : i === 0 ? 'Next up' : dayLabel(e.date);
  const pills = `<div class="pillrow">${wxPill(e)}${drivePill(e)}${e.who && e.who.length ? avatars(e.who) : ''}</div>`;
  const lead = i === 0;                                 // the first card counts down even while it is nested; the rest show "2d 9h" in the corner
  const head = `<div class="head"><div class="grow"><p class="eyebrow">${eyebrow}</p><h3>${esc(e.title)}</h3><p class="when">${when}</p></div>
    ${open ? `<button class="iconbtn pinbtn pin${pinned ? ' on' : ''}" data-act="pin-event" data-id="${e.id}" aria-label="${pinned ? 'Unpin' : 'Pin to the top'}" aria-pressed="${pinned}">${icon('pin')}</button>`
           : lead ? '' : `<div class="soon" data-target="${at}">${soonLabel(ms)}<small>${ms <= 0 ? 'happening' : 'to go'}</small></div>`}</div>`;
  if (!open) return `<article class="card nested${lead ? ' lead' : ''} tone-${tone}" data-act="expand-card" data-id="${e.id}" role="button" tabindex="0" aria-expanded="false" aria-label="Open ${esc(e.title)}">${head}${pills}${lead ? digitsHtml(at) : ''}</article>`;
  const dI = e.address ? driveInfo(e) : null;
  const directions = e.address ? `
      ${dI && dI.here ? '' : `<div class="routemap" id="routeMap"><p class="hint">${gcache.routes[routeKey(e)] && gcache.routes[routeKey(e)].polyline ? 'Loading the map…' : 'Getting the route…'}</p></div>`}
      ${mapButtons(e)}` : '';
  return `<article class="card expanded tone-${tone}" data-id="${e.id}" aria-expanded="true">
    ${head}${pills}
    ${digitsHtml(at)}
    ${driveLine(e)}
    ${nudgeLine(e)}
    ${directions}
    ${bioHtml(e)}
    <div class="foot"><button data-act="open-sheet" data-kind="event" data-id="${e.id}">${icon('pencil')} Edit event</button><button data-act="collapse-card">${icon('up')} Close</button></div>
  </article>`;
}
// The four-number countdown. Every copy on the screen carries its own target time and is ticked by tickCountdown().
function digitsHtml(at) {
  return `<div class="digits" data-target="${at}">
      <div class="d"><b class="cd-d">00</b><span>days</span></div>
      <div class="d"><b class="cd-h">00</b><span>hours</span></div>
      <div class="d"><b class="cd-m">00</b><span>min</span></div>
      <div class="d"><b class="cd-s">00</b><span>sec</span></div>
    </div><p class="now" hidden>Happening now</p>`;
}
// The open card's map and place details are mounted after the screen is drawn.
function mountCard() {
  if (!expandedCardId) return;
  const e = sortedEvents().find(x => x.id === expandedCardId);
  if (!e) return;
  if (e.address && gset.apiKey && hasHome()) {
    const r = gcache.routes[routeKey(e)];
    const el = $('#routeMap');
    if (r && r.polyline && el) drawRouteMap(el, r);
    else refreshRoute(e, !!(r && r.sec && !r.polyline));    // the render after the answer arrives draws the map
  }
  if (e.placeId && gset.apiKey) refreshPlace(e.placeId);
}
// After a card opens: bring the slim Today bar and the card to the top of the screen, under the header.
function scrollToOpenCard() {
  const card = $('.card.expanded'), bar = $('.todaybar'), head = $('#topbar');
  if (!card) return;
  const prevIsCard = card.previousElementSibling && card.previousElementSibling.classList.contains('card');
  const anchor = prevIsCard ? card : (bar || card);
  const y = anchor.getBoundingClientRect().top + window.scrollY - (head ? head.offsetHeight : 0) - (prevIsCard && bar ? bar.offsetHeight + 12 : 6);   // leave room for the slim bar that sticks under the header
  window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
}
// Open one card (the Today view folds up), or fold it back.
function expandCard(id) {
  const home = $('#home'), tv = $('#todayview');
  if (id && home && tv && !expandedCardId) {
    tv.style.maxHeight = tv.scrollHeight + 'px';        // give the fold a starting height so it animates
    void tv.offsetHeight;
    home.classList.add('expanded');
    expandedCardId = id;
    setTimeout(() => { render(); scrollToOpenCard(); }, 300);
  } else {
    expandedCardId = id;
    render();
    if (!id) { const tv2 = $('#todayview'); if (tv2) { tv2.style.maxHeight = '0px'; void tv2.offsetHeight; tv2.style.maxHeight = tv2.scrollHeight + 'px'; setTimeout(() => { tv2.style.maxHeight = 'none'; }, 340); } window.scrollTo({ top: 0, behavior: 'smooth' }); }
  }
  haptic(6);
}

function eventRow(e, { simple = false } = {}) {
  const pinned = e.id === state.featuredEventId;
  const ms = parseDT(e.date, e.time) - Date.now();
  return `<div class="row" data-swipe data-type="event" data-id="${e.id}">
    <div class="row-under right">${icon('trash')} Delete</div>
    <div class="row-face" data-act="open-sheet" data-kind="event" data-id="${e.id}">
      <div class="time mono">${timeLabel(e.time)}</div>
      <div class="grow"><div class="title">${esc(e.title)}</div>
        <div class="meta">${e.who && e.who.length ? avatars(e.who) : ''}${e.where ? `<span>${esc(e.where)}</span>` : ''}${simple ? '' : `<span class="pill${ms < 86400e3 && ms > -3600e3 ? ' sun' : ''}">${inLabel(ms)}</span>`}${wxPill(e)}${drivePill(e)}</div></div>
      <button class="iconbtn pin${pinned ? ' on' : ''}" data-act="pin-event" data-id="${e.id}" aria-label="${pinned ? 'Unpin from countdown' : 'Pin to countdown'}" aria-pressed="${pinned}">${icon('pin')}</button>
    </div></div>`;
}
function choreRow(c) {
  const ts = isoDate(today());
  const overdue = !c.done && c.due < ts;
  return `<div class="row${c.done ? ' done' : ''}" data-swipe data-type="chore" data-id="${c.id}">
    <div class="row-under left">${icon('check')} ${c.done ? 'Not done' : 'Done'}</div>
    <div class="row-under right">${icon('trash')} Delete</div>
    <div class="row-face">
      <button class="check${c.done ? ' on' : ''}" data-act="toggle-chore" data-id="${c.id}" role="checkbox" aria-checked="${c.done}" aria-label="Mark ${esc(c.title)} ${c.done ? 'not done' : 'done'}"><span class="box"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7"/></svg></span></button>
      <div class="grow" data-act="open-sheet" data-kind="chore" data-id="${c.id}"><div class="title">${esc(c.title)}</div>
        <div class="meta">${avatar(c.who)}<span>${esc(member(c.who)?.name || 'Anyone')}</span><span class="pill${overdue ? ' danger' : ''}">${overdue ? 'Overdue · ' : ''}${dayLabel(c.due)}</span>${c.repeat !== 'none' ? `<span title="Repeats ${c.repeat}" style="display:inline-flex;color:var(--muted)"><svg class="i" style="width:14px;height:14px"><use href="#i-repeat"/></svg></span>` : ''}</div></div>
    </div></div>`;
}

function renderCalendar() {
  const t = today(), ts = isoDate(t);
  const days = [...Array(7)].map((_, i) => addDays(calWeek, i));
  const selD = parseDT(calSel);
  const monthLabel = `${MONTHS[selD.getMonth()]} ${selD.getFullYear()}`;
  const strip = days.map(d => {
    const iso = isoDate(d);
    const evs = state.events.filter(e => e.date === iso);
    const dots = evs.slice(0, 3).map(e => `<i style="--dc:${member((e.who || [])[0])?.color || 'var(--accent)'}"></i>`).join('');
    return `<button class="day${iso === calSel ? ' sel' : ''}${iso === ts ? ' today' : ''}" data-act="select-day" data-date="${iso}" aria-label="${longDate(iso)}${evs.length ? `, ${evs.length} event${evs.length === 1 ? '' : 's'}` : ''}" aria-pressed="${iso === calSel}"><span class="wd">${WDS[d.getDay()]}</span><span class="num">${d.getDate()}</span><span class="dots">${dots}</span></button>`;
  }).join('');

  const dayEvents = sortedEvents().filter(e => e.date === calSel);
  const upcoming = sortedEvents().filter(e => e.date !== calSel && e.at > Date.now()).slice(0, 8);
  const dayList = dayEvents.length
    ? `<div class="list">${dayEvents.map(e => eventRow(e)).join('')}</div>`
    : emptyState({ glyph: 'cal', title: `Nothing on ${dayLabel(calSel) === 'Today' ? 'today' : dayLabel(calSel)}`, body: 'Practices, appointments, birthdays — put them here and everyone sees them.', action: 'Add an event', act: `data-act="open-sheet" data-kind="event" data-date="${calSel}"`, quiet: true });

  $('#screen-calendar').innerHTML = `
    <div class="weeknav"><button class="iconbtn" data-act="week-prev" aria-label="Previous week">${icon('left')}</button><h2 id="monthLabel">${monthLabel}</h2><button class="iconbtn" data-act="week-next" aria-label="Next week">${icon('right')}</button></div>
    <div class="week" id="weekStrip">${strip}</div>
    <div class="sec"><h2>${longDate(calSel)}</h2>${calSel !== ts ? `<button class="link" data-act="week-today">Back to today</button>` : ''}</div>
    ${dayList}
    <div class="sec"><h2>Coming up</h2></div>
    ${upcoming.length ? `<div class="list">${upcoming.map(e => `<div><div class="daylbl">${dayLabel(e.date)}</div>${eventRow(e)}</div>`).join('')}</div>`
      : emptyState({ glyph: 'clock', title: 'Nothing coming up', body: 'The countdown on Today follows whatever you add next.', quiet: true })}`;
  wireRows($('#screen-calendar'));
  enableWeekSwipe($('#weekStrip'));
  syncGoogle();
}

function renderChores(root) {
  const ts = isoDate(today());
  const chips = `<div class="chips" role="group" aria-label="Show chores for">
      <button class="chip${choreFilter === 'all' ? ' on' : ''}" data-act="filter" data-id="all">Everyone</button>
      ${state.members.map(m => `<button class="chip${choreFilter === m.id ? ' on' : ''}" data-act="filter" data-id="${m.id}">${avatar(m.id)}${esc(m.name)}</button>`).join('')}
    </div>`;
  const mine = c => choreFilter === 'all' || c.who === choreFilter;
  const open = state.chores.filter(c => !c.done && mine(c)).sort((a, b) => a.due.localeCompare(b.due) || a.title.localeCompare(b.title));
  const done = state.chores.filter(c => c.done && mine(c)).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0)).slice(0, 12);
  const who = choreFilter === 'all' ? '' : member(choreFilter)?.name;

  let openHtml;
  if (open.length) {
    // group by due day so "today" reads as one block
    const groups = new Map();
    open.forEach(c => { const k = c.due < ts ? 'Overdue' : dayLabel(c.due); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(c); });
    openHtml = [...groups].map(([label, list]) => `<div class="sec" style="margin-top:12px"><h2 ${label === 'Overdue' ? 'style="color:var(--danger)"' : ''}>${label}</h2></div><div class="list">${list.map(choreRow).join('')}</div>`).join('');
  } else if (state.chores.some(c => mine(c))) {
    openHtml = emptyState({ glyph: 'spark', title: who ? `${esc(who)} is all caught up` : 'Everything is done', body: 'Nothing left on the list. Add the next chore whenever it comes up.', action: 'Add a chore', act: 'data-act="open-sheet" data-kind="chore"' });
  } else {
    openHtml = emptyState({ glyph: 'check-circle', title: 'No chores yet', body: 'Give each job a person and a day. Swipe right when it’s done.', action: 'Add the first chore', act: 'data-act="open-sheet" data-kind="chore"' });
  }
  root.innerHTML = `${chips}${openHtml}
    ${done.length ? `<div class="sec"><h2>Done</h2><button class="link" data-act="clear-done">Clear</button></div><div class="list">${done.map(choreRow).join('')}</div>` : ''}`;
  wireRows(root);
}

function renderGrocery(root) {
  const buy = state.grocery.filter(g => !g.done);
  const cart = state.grocery.filter(g => g.done);
  const gRow = g => `<div class="row${g.done ? ' done' : ''}" data-swipe data-type="grocery" data-id="${g.id}">
      <div class="row-under right">${icon('trash')} Delete</div>
      <div class="row-face" data-act="toggle-grocery" data-id="${g.id}" role="checkbox" aria-checked="${g.done}" tabindex="0">
        <span class="check${g.done ? ' on' : ''}" aria-hidden="true"><span class="box"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7"/></svg></span></span>
        <div class="grow"><div class="title">${esc(g.name)}</div></div>${g.qty ? `<span class="pill">${esc(g.qty)}</span>` : ''}
      </div></div>`;
  root.innerHTML = `
    <form class="quickadd" id="quickAdd" autocomplete="off">
      <input type="text" name="name" placeholder="Add an item…" aria-label="Item" maxlength="60" required>
      <input type="text" name="qty" class="qty" placeholder="Qty" aria-label="Quantity" maxlength="10">
      <button type="submit" aria-label="Add to list">${icon('plus')}</button>
    </form>
    ${buy.length ? `<div class="sec"><h2>To buy</h2></div><div class="list">${buy.map(gRow).join('')}</div>`
      : (cart.length ? emptyState({ glyph: 'check-circle', title: 'Everything is in the cart', body: 'Nice. Clear the checked items when you’re home, or add the next thing you run out of.', quiet: true })
                     : emptyState({ glyph: 'basket', title: 'The list is empty', body: 'Type what you’re out of. Tap an item at the store to check it off.' }))}
    ${cart.length ? `<div class="sec"><h2>In the cart</h2><button class="link" data-act="clear-cart">Clear ${cart.length}</button></div><div class="list">${cart.map(gRow).join('')}</div>` : ''}`;
  wireRows(root);
  $('#quickAdd').addEventListener('submit', e => {
    e.preventDefault();
    const f = e.target, name = f.name.value.trim(), qty = f.qty.value.trim();
    if (!name) return;
    state.grocery.unshift({ id: uid(), name, qty, done: false });
    save(); haptic(8); render();
    const input = $('#quickAdd input[name=name]'); if (input) input.focus();
  });
}

function renderBoard() {
  const notes = [...state.notes].sort((a, b) => (b.pinned - a.pinned) || (b.at - a.at));
  const nRow = n => `<div class="row note" style="--nc:var(--${n.color || 'note-1'})" data-swipe data-type="note" data-id="${n.id}" data-longpress>

      <div class="row-face" data-act="open-sheet" data-kind="note" data-id="${n.id}">
        <p class="txt">${esc(n.text)}</p>
        <div class="foot">${avatar(n.who)}<span class="who">${esc(member(n.who)?.name || 'Someone')}</span><span>· ${ago(n.at)}</span>
          <button class="iconbtn pin${n.pinned ? ' on' : ''}" data-act="pin-note" data-id="${n.id}" aria-label="${n.pinned ? 'Unpin note' : 'Pin note to top'}" aria-pressed="${n.pinned}">${icon('pin')}</button></div>

  $('#screen-board').innerHTML = notes.length

  wireRows($('#screen-board'));
}

// Which members have their picture choices open (plain memory: they fold again the next time the app opens).
const picsOpen = new Set();
// The picture choices for one member, in groups (People, Animals, Things) with a small heading for each kind inside a group.
const PIC_GROUPS = { initial: 'Initial', people: 'People', animals: 'Animals', things: 'Things' };
function picChoices(m) {
  let group = null, sub = null, out = '';
  MEMBER_PICS.forEach(p => {
    if (p.group !== group) { group = p.group; sub = null; out += `<span class="lbl">${PIC_GROUPS[group] || group}</span>`; }
    if (p.sub && p.sub !== sub) { sub = p.sub; out += `<span class="sub">${p.sub}</span>`; }
    const on = (m.pic || '') === p.id;
    out += `<button class="${on ? 'on' : ''}" data-act="member-pic" data-id="${m.id}" data-pic="${p.id}" aria-label="${p.label}" aria-pressed="${on}"><span class="av" style="--c:${m.color}">${avatarFace(m, p.id)}</span></button>`;
  });
  return out;
}
function renderFamily() {
  const rows = state.members.map(m => { const open = picsOpen.has(m.id); return `<div class="member${open ? ' open' : ''}" data-id="${m.id}">

      <input type="text" value="${esc(m.name)}" data-field="memberName" data-id="${m.id}" aria-label="Name" maxlength="24">
      <div class="swatches" role="group" aria-label="Color">${MEMBER_COLORS.map(c => `<button class="swatch${m.color === c ? ' on' : ''}" style="background:${c}" data-act="member-color" data-id="${m.id}" data-color="${c}" aria-label="Color ${c}" aria-pressed="${m.color === c}"></button>`).join('')}<button class="iconbtn morebtn" data-act="member-more" data-id="${m.id}" aria-expanded="${open}" aria-controls="pics-${m.id}" aria-label="Pictures for ${esc(m.name || 'this member')}">${icon('down')}</button></div>
      <button class="iconbtn" data-act="remove-member" data-id="${m.id}" aria-label="Remove ${esc(m.name)}">${icon('x')}</button>

    </div>`; }).join('');
  $('#screen-family').innerHTML = `
    <div class="field" style="margin-top:12px"><label for="famName">Family name</label><input type="text" id="famName" value="${esc(state.familyName)}" data-field="familyName" maxlength="40" placeholder="The Smiths"></div>

    <div style="margin-top:12px"><button class="btn btn-ghost" data-act="add-member">${icon('plus')} Add a member</button></div>
    <div class="sec"><h2>Weather &amp; drive times</h2></div>
    <div class="gbox">
      <div class="field"><label for="gKey">Google API key</label><input type="text" id="gKey" class="key" value="${esc(gset.apiKey)}" data-field="apiKey" placeholder="Paste the key from Google Cloud" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
      <div class="field"><label for="gHome">Home address <span style="font-weight:400;color:var(--muted)">(drives start here)</span></label><input type="text" id="gHome" value="${esc(gset.homeAddress)}" data-field="homeAddress" placeholder="2815 Sutherland Ave, Knoxville, TN" autocomplete="street-address"></div>
      <div class="field"><label for="gCoords">Weather location <span style="font-weight:400;color:var(--muted)">(latitude, longitude)</span></label>
        <div class="two"><input type="text" id="gCoords" value="${hasLoc() ? `${gset.lat}, ${gset.lng}` : ''}" data-field="homeCoords" placeholder="35.9606, -83.9207" inputmode="decimal" autocomplete="off"><button class="btn btn-ghost" data-act="use-location">${icon('nav')} Use my location</button></div></div>
      <label class="switch"><input type="checkbox" data-field="unitsC" ${gset.units === 'C' ? 'checked' : ''}><span class="knob"></span><span>Show °C and km instead of °F and miles</span></label>
      <div class="gstatus" id="gStatus"></div>
      <button class="btn btn-ghost" data-act="test-google">Test the connection</button>
      <p class="hint">Drive times need the home address and an address on the event. Weather needs the location. The key is kept on this device only and is never sent anywhere but Google. A green pin on an event's weather means it's the forecast at the venue.</p>
    </div>
    <div class="sec"><h2>Family phones</h2></div>
    <div class="gbox">
      <p class="hint">Each phone keeps its own copy of the key and these settings. Hand them to another phone with a code it scans — no typing.</p>
      <button class="btn btn-ghost" data-act="add-phone">${icon('phone')} Add a phone</button>
    </div>
    <div class="sec"><h2>Data</h2></div>
    <div class="danger-zone">
      <p>Everything is saved on this device only. Resetting puts back the example data; clearing empties the app.</p>
      <button class="btn btn-ghost" data-act="reset" data-confirm="Tap again to reset">Reset to example data</button>
      <button class="btn btn-danger" data-act="wipe" data-confirm="Tap again to clear everything">Clear all data</button>
    </div>`;
  updateGStatus();
}
/* ---------- 5. SHEETS: one slide-up form per job (add/edit an event, chore or note) ---------- */
let sheetKind = null, sheetId = null, sheetHideTimer = null;

function whoChips(name, selected, { multi = false } = {}) {
  return `<div class="who" role="group" aria-label="Who">${state.members.map(m => {
    const on = multi ? selected.includes(m.id) : selected === m.id;
    return `<button type="button" class="chip${on ? ' on' : ''}" data-who="${m.id}" aria-pressed="${on}">${avatar(m.id)}${esc(m.name)}</button>`;
  }).join('')}<input type="hidden" name="${name}" value="${multi ? selected.join(',') : (selected || '')}"></div>`;
}

function openSheet(kind, id = null, presets = {}) {
  sheetKind = kind; sheetId = id;
  const body = $('#sheetBody');
  let html = '';
  if (kind === 'event') {
    const e = id ? state.events.find(x => x.id === id) : null;
    const v = { title: '', date: presets.date || (current === 'calendar' ? calSel : isoDate(today())), time: '18:00', who: [], where: '', address: '', placeId: '', ...(e || {}), ...(id ? {} : presetFields(presets)) };
    html = `<h2 id="sheetTitle">${e ? 'Edit event' : 'New event'}</h2>
      <form id="sheetForm">
        <div class="field"><label for="f-title">What</label><input id="f-title" type="text" name="title" value="${esc(v.title)}" placeholder="Soccer practice" maxlength="60" required></div>
        <div class="field"><span class="lbl">When</span><div class="two"><input type="date" name="date" value="${v.date}" aria-label="Date" required><input type="time" name="time" value="${v.time}" aria-label="Time"></div></div>
        <div class="field"><span class="lbl">Who</span>${whoChips('who', v.who || [], { multi: true })}</div>
        <div class="field"><label for="f-where">Where <span style="font-weight:400;color:var(--muted)">(optional)</span></label><input id="f-where" type="text" name="where" value="${esc(v.where || '')}" placeholder="Lakeside fields" maxlength="40"></div>
        <div class="field"><label for="f-address">Address <span style="font-weight:400;color:var(--muted)">(optional · turns on the drive time)</span></label><input id="f-address" type="text" name="address" value="${esc(v.address || '')}" placeholder="1500 Lakeshore Dr, Knoxville, TN" maxlength="120" autocomplete="off" autocapitalize="words" role="combobox" aria-autocomplete="list" aria-expanded="false"><input type="hidden" name="placeId" value="${esc(v.placeId || '')}"></div>
        ${e && e.address ? `<div class="sec" style="margin-top:4px"><h2>Directions</h2></div><div id="dirBox">${directionsHtml(e)}</div>` : (e ? nudgeLine(e, { inCard: false }) : '')}
        <label class="switch"><input type="checkbox" name="pinned" ${e && state.featuredEventId === e.id ? 'checked' : ''}><span class="knob"></span><span>Feature in the countdown on Today</span></label>
        <div class="actions">${e ? `<button type="button" class="btn btn-danger" data-act="sheet-delete">Delete</button>` : ''}<button type="submit" class="btn btn-primary">${e ? 'Save' : 'Add event'}</button></div>
      </form>`;
  } else if (kind === 'chore') {
    const c = id ? state.chores.find(x => x.id === id) : null;
    const v = { title: '', who: (choreFilter !== 'all' && choreFilter) || state.members[0]?.id || '', due: isoDate(today()), repeat: 'none', ...(c || {}), ...(id ? {} : presetFields(presets)) };
    html = `<h2 id="sheetTitle">${c ? 'Edit chore' : 'New chore'}</h2>
      <form id="sheetForm">
        <div class="field"><label for="f-title">What</label><input id="f-title" type="text" name="title" value="${esc(v.title)}" placeholder="Empty the dishwasher" maxlength="60" required></div>
        <div class="field"><span class="lbl">Whose job</span>${whoChips('who', v.who)}</div>
        <div class="field"><span class="lbl">Due</span><div class="two"><input type="date" name="due" value="${v.due}" aria-label="Due date" required>
          <select name="repeat" aria-label="Repeats"><option value="none" ${v.repeat === 'none' ? 'selected' : ''}>Once</option><option value="daily" ${v.repeat === 'daily' ? 'selected' : ''}>Every day</option><option value="weekly" ${v.repeat === 'weekly' ? 'selected' : ''}>Every week</option></select></div></div>
        <div class="actions">${c ? `<button type="button" class="btn btn-danger" data-act="sheet-delete">Delete</button>` : ''}<button type="submit" class="btn btn-primary">${c ? 'Save' : 'Add chore'}</button></div>
      </form>`;
  } else if (kind === 'note') {
    const n = id ? state.notes.find(x => x.id === id) : null;
    const v = { text: '', who: state.members[0]?.id || '', color: NOTE_COLORS[state.notes.length % NOTE_COLORS.length], pinned: false, ...(n || {}), ...(id ? {} : presetFields(presets)) };
    html = `<h2 id="sheetTitle">${n ? 'Edit note' : 'New note'}</h2>
      <form id="sheetForm">
        <div class="field"><label for="f-text">Note</label><textarea id="f-text" name="text" placeholder="Grandma's visiting Sunday…" maxlength="280" required>${esc(v.text)}</textarea></div>
        <div class="field"><span class="lbl">From</span>${whoChips('who', v.who)}</div>
        <div class="field"><span class="lbl">Color</span><div class="colorpick" role="group" aria-label="Note color">${NOTE_COLORS.map(c => `<button type="button" class="${v.color === c ? 'on' : ''}" style="background:var(--${c})" data-color="${c}" aria-label="${c}" aria-pressed="${v.color === c}"></button>`).join('')}<input type="hidden" name="color" value="${v.color}"></div></div>
        <label class="switch"><input type="checkbox" name="pinned" ${v.pinned ? 'checked' : ''}><span class="knob"></span><span>Keep at the top of the board</span></label>
        <div class="actions">${n ? `<button type="button" class="btn btn-danger" data-act="sheet-delete">Delete</button>` : ''}<button type="submit" class="btn btn-primary">${n ? 'Save' : 'Post note'}</button></div>
      </form>`;
  } else if (kind === 'weather') {
    html = weatherSheet();                 // not a form — a read-only detail view (section 8)
  } else if (kind === 'phone') {
    html = phoneSheet();                   // the Add-a-phone code (section 8)
  } else if (kind === 'write') {
    html = writeSheet(presets);            // v2 capture sheets (section 10)
  } else if (kind === 'files') {
    html = filesSheet();
  } else if (kind === 'voice') {
    html = voiceSheet();
  } else if (kind === 'chat') {
    html = chatSheet();
  } else if (kind === 'inbox') {
    html = inboxSheet();
  } else if (kind === 'capture-menu') {
    html = captureMenuSheet();
  }
  body.innerHTML = html;
  if (kind === 'event') wireAddressSuggest(body);                       // Google's address suggestions under the Address field
  if (kind === 'files') wireFilesSheet(body);
  if (kind === 'chat') wireChatSheet(body);
  if (kind === 'event' && id && $('#dirBox')) mountDirections(state.events.find(x => x.id === id));

  // chips inside the form: tap to pick a person / a color
  body.querySelectorAll('[data-who]').forEach(b => b.addEventListener('click', () => {
    const hidden = b.parentElement.querySelector('input[type=hidden]');
    const multi = kind === 'event';
    if (multi) {
      const set = new Set(hidden.value ? hidden.value.split(',') : []);
      set.has(b.dataset.who) ? set.delete(b.dataset.who) : set.add(b.dataset.who);
      hidden.value = [...set].join(',');
      b.classList.toggle('on'); b.setAttribute('aria-pressed', b.classList.contains('on'));
    } else {
      hidden.value = b.dataset.who;
      b.parentElement.querySelectorAll('.chip').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', x === b); });
    }
  }));
  body.querySelectorAll('.colorpick button').forEach(b => b.addEventListener('click', () => {
    b.parentElement.querySelector('input[type=hidden]').value = b.dataset.color;
    b.parentElement.querySelectorAll('button').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', x === b); });
  }));
  const form = $('#sheetForm');
  if (form) form.addEventListener('submit', onSheetSubmit);

  const wrap = $('#sheetWrap');
  clearTimeout(sheetHideTimer);
  wrap.hidden = false;
  requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add('open')));
  document.body.style.overflow = 'hidden';
  setTimeout(() => { const f = body.querySelector('input[type=text], textarea'); if (f && !id) f.focus(); }, 280);
}

function closeSheet() {
  stopListening();                                   // in case the voice sheet was open
  const wrap = $('#sheetWrap');
  $('#sheet').style.transform = '';
  wrap.classList.remove('open');
  document.body.style.overflow = '';
  sheetHideTimer = setTimeout(() => { wrap.hidden = true; $('#sheet').style.transform = ''; }, 260);
  sheetKind = null; sheetId = null;
}

function onSheetSubmit(e) {
  e.preventDefault();
  const f = new FormData(e.target);
  const val = k => (f.get(k) || '').toString().trim();
  if (sheetKind === 'event') {
    const who = val('who') ? val('who').split(',').filter(Boolean) : [];
    const data = { title: val('title'), date: val('date'), time: val('time') || '00:00', who, where: val('where'), address: val('address'), placeId: val('address') ? val('placeId') : '' };
    if (!data.title || !data.date) return;
    let id = sheetId;
    if (id) Object.assign(state.events.find(x => x.id === id), data);
    else { id = uid(); state.events.push({ id, ...data }); }
    if (f.get('pinned')) state.featuredEventId = id; else if (state.featuredEventId === id) state.featuredEventId = null;
    if (current === 'calendar') { calSel = data.date; calWeek = startOfWeek(parseDT(data.date)); }
    toast(sheetId ? 'Event saved' : 'Event added');
  } else if (sheetKind === 'chore') {
    const data = { title: val('title'), who: val('who'), due: val('due'), repeat: val('repeat') || 'none' };
    if (!data.title || !data.due) return;
    if (sheetId) Object.assign(state.chores.find(x => x.id === sheetId), data);
    else state.chores.push({ id: uid(), ...data, done: false });
    toast(sheetId ? 'Chore saved' : 'Chore added');
  } else if (sheetKind === 'note') {
    const data = { text: val('text'), who: val('who'), color: val('color') || 'note-1', pinned: !!f.get('pinned') };
    if (!data.text) return;
    if (sheetId) Object.assign(state.notes.find(x => x.id === sheetId), data);
    else state.notes.unshift({ id: uid(), ...data, at: Date.now() });
    toast(sheetId ? 'Note saved' : 'Note posted');
  }
  if (pendingCaptureId) { state.captures = state.captures.filter(c => c.id !== pendingCaptureId); pendingCaptureId = null; }   // the capture this came from is sorted now
  save(); haptic(10); closeSheet(); render();
}

/* ---------- actions: every tappable thing has a data-act, handled in one place ---------- */
let confirmTimer = null;
function snapshot() { return JSON.stringify(state); }
function restore(snap) { state = JSON.parse(snap); save(); render(); }

function removeItem(type, id) {
  const before = snapshot();
  const list = { event: state.events, chore: state.chores, grocery: state.grocery, note: state.notes }[type];
  const i = list.findIndex(x => x.id === id);
  if (i < 0) return;
  list.splice(i, 1);
  if (type === 'event' && state.featuredEventId === id) state.featuredEventId = null;
  save(); haptic(12); render();
  toast(`${{ event: 'Event', chore: 'Chore', grocery: 'Item', note: 'Note' }[type]} deleted`, () => restore(before));
}

function toggleChore(id) {
  const c = state.chores.find(x => x.id === id);
  if (!c) return;
  const before = snapshot();
  c.done = !c.done;
  c.doneAt = c.done ? Date.now() : null;
  let msg = c.done ? 'Chore done' : 'Chore reopened';
  // repeating chores come back on the next day / next week
  if (c.done && c.repeat !== 'none') {
    const base = c.due < isoDate(today()) ? today() : parseDT(c.due);   // an overdue chore restarts from today
    const next = isoDate(addDays(base, c.repeat === 'daily' ? 1 : 7));
    state.chores.push({ id: uid(), title: c.title, who: c.who, due: next, repeat: c.repeat, done: false });
    const L = dayLabel(next);
    msg = `Done · back ${L === 'Tomorrow' || L === 'Today' ? L.toLowerCase() : 'on ' + L}`;
  }
  save(); haptic(c.done ? 14 : 6); render();
  toast(msg, () => restore(before));
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch (act) {
    case 'tab': setTab(el.dataset.tab); break;
    case 'open-sheet': openSheet(el.dataset.kind, id || null, { date: el.dataset.date }); break;
    case 'toggle-chore': toggleChore(id); break;
    case 'toggle-grocery': {
      const g = state.grocery.find(x => x.id === id); if (!g) break;
      g.done = !g.done; save(); haptic(g.done ? 12 : 6);
      const row = el.closest('.row'); row.classList.add('leaving');
      setTimeout(render, 200);
      break;
    }
    case 'pin-event': {
      state.featuredEventId = state.featuredEventId === id ? null : id;
      save(); haptic(8); render();
      toast(state.featuredEventId ? 'Countdown pinned' : 'Countdown follows the next event');
      break;
    }
    case 'pin-note': { const n = state.notes.find(x => x.id === id); if (n) { n.pinned = !n.pinned; save(); haptic(8); render(); } break; }
    case 'select-day': calSel = el.dataset.date; render(); break;
    case 'week-prev': shiftWeek(-1); break;
    case 'week-next': shiftWeek(1); break;
    case 'week-today': calSel = isoDate(today()); calWeek = startOfWeek(today()); if (current !== 'calendar') setTab('calendar'); else render(); break;
    case 'filter': choreFilter = id; render(); break;
    case 'clear-done': { const before = snapshot(); state.chores = state.chores.filter(c => !c.done); save(); render(); toast('Done chores cleared', () => restore(before)); break; }
    case 'clear-cart': { const before = snapshot(); state.grocery = state.grocery.filter(g => !g.done); save(); render(); toast('Cart cleared', () => restore(before)); break; }
    case 'add-member': {
      state.members.push({ id: uid(), name: '', color: MEMBER_COLORS[state.members.length % MEMBER_COLORS.length] });
      save(); render();
      const inputs = document.querySelectorAll('#screen-family [data-field=memberName]'); inputs[inputs.length - 1]?.focus();
      break;
    }
    case 'remove-member': {
      const before = snapshot(); const m = member(id);
      state.members = state.members.filter(x => x.id !== id);
      if (choreFilter === id) choreFilter = 'all';
      save(); render(); toast(`${m?.name || 'Member'} removed`, () => restore(before));
      break;
    }
    case 'member-color': { const m = member(id); if (m) { m.color = el.dataset.color; save(); render(); } break; }
    case 'member-pic': { const m = member(id); if (m) { m.pic = el.dataset.pic || ''; save(); haptic(6); render(); } break; }
    case 'member-more': {                          // the arrow on a member's color line: show or hide the pictures underneath
      const open = !picsOpen.has(id);
      if (open) picsOpen.add(id); else picsOpen.delete(id);
      const row = el.closest('.member'); if (row) row.classList.toggle('open', open);
      el.setAttribute('aria-expanded', open); haptic(4);
      break;
    }
    case 'reset': case 'wipe': {
      // two taps to do something big — no pop-up dialogs
      if (el.dataset.armed) {
        clearTimeout(confirmTimer);
        state = act === 'reset' ? sampleData() : { familyName: state.familyName, members: state.members, events: [], chores: [], grocery: [], notes: [], featuredEventId: null };
        save(); render(); toast(act === 'reset' ? 'Example data is back' : 'Everything cleared');
      } else {
        el.dataset.armed = '1'; el.dataset.label = el.textContent; el.textContent = el.dataset.confirm;
        confirmTimer = setTimeout(() => { delete el.dataset.armed; el.textContent = el.dataset.label; }, 3000);
      }
      break;
    }
    case 'sheet-close': closeSheet(); break;
    case 'sheet-delete': { const t = sheetKind, i = sheetId; closeSheet(); removeItem(t, i); break; }
    /* v2: the home cards, the Lists switch, the header "+" */
    case 'expand-card': expandCard(id); break;
    case 'collapse-card': expandCard(null); break;
    case 'toggle-today': toggleToday(); break;
    case 'lists-mode': listsMode = el.dataset.mode; render(); break;
    case 'add-here': { const fn = ADD_ACTIONS[current]; if (fn) fn(); break; }
    /* v2: the camera and the capture inbox */
    case 'cam-close': closeCamera(); break;
    case 'cam-flip': flipCamera(); break;
    case 'cam-shot': takePhoto('photo'); break;
    case 'cam-lens': takePhoto('lens'); break;
    case 'cap-sort': sortCapture(id, el.dataset.to); break;
    case 'cap-delete': { const before = snapshot(); state.captures = state.captures.filter(c => c.id !== id); save(); render(); if (sheetKind === 'inbox') openSheet('inbox'); toast('Removed', () => restore(before)); break; }
    case 'cap-apply': applyProposal(el.dataset.pid); break;
    case 'cap-edit': editProposal(el.dataset.pid); break;
    case 'voice-toggle': toggleListening(); break;
    case 'voice-use': useTranscript(); break;
    case 'chat-send': chatSend(); break;
    case 'write-sort': writeSort(); break;
    /* Google services (section 8) */
    case 'use-location': useMyLocation(); break;
    case 'test-google': testGoogle(); break;
    case 'refresh-weather': refreshWeather(true).then(() => { if (sheetKind === 'weather') $('#sheetBody').innerHTML = weatherSheet(); }); break;
    case 'add-phone': openSheet('phone'); break;
    case 'copy-setup': {
      const link = setupLink();
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(() => toast('Link copied — send it to the other phone'), () => toast('Couldn’t copy — select the link and copy it by hand'));
      else toast('Select the link and copy it by hand');
      break;
    }
  }
});

// typing on the Family screen saves as you go
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.field === 'familyName') { state.familyName = el.value; save(); }
  if (el.dataset.field === 'memberName') {
    const m = member(el.dataset.id); if (!m) return;
    m.name = el.value;
    // every circle in this card that shows an initial follows the name as it's typed (pictures stay put)
    el.closest('.member')?.querySelectorAll('.av').forEach(av => { if (!av.querySelector('.pic')) av.textContent = (m.name.trim()[0] || '?').toUpperCase(); });
    save();
  }
  // the Google settings box saves as you type too
  if (el.dataset.field === 'apiKey') { gset.apiKey = el.value.trim(); saveGoogleSettings(); updateGStatus(); }
  if (el.dataset.field === 'homeAddress') { gset.homeAddress = el.value.trim(); saveGoogleSettings(); updateGStatus(); }
  if (el.dataset.field === 'homeCoords') {
    const m = el.value.match(/^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/);
    if (m) { gset.lat = Number(m[1]); gset.lng = Number(m[2]); } else if (!el.value.trim()) { gset.lat = null; gset.lng = null; }
    saveGoogleSettings(); updateGStatus();
  }
  if (el.dataset.field === 'unitsC') { gset.units = el.checked ? 'C' : 'F'; saveGoogleSettings(); refreshWeather(true).then(updateGStatus); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#sheetWrap').hidden) closeSheet();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.row-face[role=checkbox]')) { e.preventDefault(); e.target.click(); }
});

/* ---------- 6. GESTURES ---------- */

// Swipe a row: right = done, left = delete. The row's "face" slides over the colored action underneath.
function enableSwipe(row, { onLeft, onRight }) {
  const face = row.querySelector('.row-face');
  let sx = 0, sy = 0, dx = 0, active = false, decided = false, pid = null;
  face.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    sx = e.clientX; sy = e.clientY; dx = 0; active = true; decided = false; pid = e.pointerId;
  });
  face.addEventListener('pointermove', e => {
    if (!active) return;
    if (e.pointerType === 'mouse' && e.buttons === 0) { active = false; return; }
    const mx = e.clientX - sx, my = e.clientY - sy;
    if (!decided) {
      if (Math.abs(mx) < 10 && Math.abs(my) < 10) return;     // not moved enough to know yet
      if (Math.abs(my) > Math.abs(mx)) { active = false; return; } // mostly vertical → let the page scroll

    dx = Math.max(-140, Math.min(140, mx));
    if (dx > 0 && !onRight) dx *= 0.25;   // a direction with no action only gives a little
    if (dx < 0 && !onLeft) dx *= 0.25;
    face.style.transform = `translateX(${dx}px)`;
    row.classList.toggle('reveal-right', dx > 0);
    row.classList.toggle('reveal-left', dx < 0);
    const armed = Math.abs(dx) > 80;
    if (armed && !row.classList.contains('armed')) haptic(6);
    row.classList.toggle('armed', armed);
  });

    if (!active) return;
    active = false;
    if (decided) { row.dataset.swiped = '1'; setTimeout(() => { delete row.dataset.swiped; }, 120); }
    row.classList.remove('swiping');
    if (dx > 80 && onRight) { face.style.transform = 'translateX(110%)'; setTimeout(onRight, 140); }
    else if (dx < -80 && onLeft) { face.style.transform = 'translateX(-110%)'; setTimeout(onLeft, 140); }

// Long-press (hold half a second) on a note opens it for editing.
function enableLongPress(el, fn) {
  let t = null, sx = 0, sy = 0;
  el.addEventListener('pointerdown', e => {
    sx = e.clientX; sy = e.clientY;
    t = setTimeout(() => { t = null; el.dataset.lp = '1'; haptic(15); fn(); setTimeout(() => { delete el.dataset.lp; }, 400); }, 500);

// after a screen is drawn, give its rows their gestures
function wireRows(root) {

/* =====================================================================
   8. GOOGLE SERVICES — weather and drive times
   Web services from Google Maps Platform, called straight from the browser:
     Weather API  https://weather.googleapis.com/v1/...   (current conditions, hourly and daily forecasts)
     Routes API   https://routes.googleapis.com/directions/v2:computeRoutes   (drive time with traffic, the route, the steps)
     Places API   https://places.googleapis.com/v1/places:autocomplete   (address suggestions while typing)
     Maps JavaScript API — the route map inside an event, loaded only when needed
   Both need an API key from Google Cloud. The key lives in this device's storage — never in this file —
   so the code can be public while the key stays yours. Google should only accept the key from your

   Everything Google sends back is cached, so opening the app ten times costs one request, not ten.
   ===================================================================== */
const GSET_KEY = 'familyhub.google.v1';       // settings: key, home, units
const GCACHE_KEY = 'familyhub.googlecache.v2'; // what Google told us, and when (v2: routes now carry their shape and steps)
const WEATHER_TTL = 30 * 60e3;                // re-ask for weather after 30 minutes
const ROUTE_TTL = 30 * 60e3;                  // re-ask for a drive time after 30 minutes...
const ROUTE_TTL_SOON = 10 * 60e3;             // ...or 10 minutes when the event is within two hours
const ERROR_TTL = 5 * 60e3;                   // after an error, wait 5 minutes before trying again
const ROUTE_HORIZON = 7 * 86400e3;            // only ask about events in the next 7 days
const ROUTE_MAX_PER_SYNC = 6;                 // never more than 6 drive-time requests per refresh

let gset = loadJSON(GSET_KEY, { apiKey: '', homeAddress: '', lat: null, lng: null, units: 'F' });
let gcache = loadJSON(GCACHE_KEY, { weather: null, routes: {}, venues: {} });   // venues: forecasts at event locations, by "lat,lng"

function loadJSON(key, fallback) {
  try { const raw = localStorage.getItem(key); if (raw) return { ...fallback, ...JSON.parse(raw) }; } catch (e) {}
  return fallback;
}
function saveGoogleSettings() { try { localStorage.setItem(GSET_KEY, JSON.stringify(gset)); } catch (e) {} }
function saveGoogleCache() {
  // forget drive times for events that are already over, and venue forecasts nobody has asked about for a day
  const cutoff = Date.now() - 86400e3;
  for (const k of Object.keys(gcache.routes)) if ((gcache.routes[k].eventAt || 0) < cutoff) delete gcache.routes[k];
  gcache.venues = gcache.venues || {};
  for (const k of Object.keys(gcache.venues)) if ((gcache.venues[k].at || 0) < cutoff) delete gcache.venues[k];
  try { localStorage.setItem(GCACHE_KEY, JSON.stringify(gcache)); } catch (e) {}
}
function hasLoc() { return typeof gset.lat === 'number' && typeof gset.lng === 'number' && !Number.isNaN(gset.lat) && !Number.isNaN(gset.lng); }
function hasHome() { return !!gset.homeAddress || hasLoc(); }
function unitsSystem() { return gset.units === 'C' ? 'METRIC' : 'IMPERIAL'; }

// Opening the app through an "Add a phone" code (…?setup=…) or a plain key link (…?key=AIza…) saves the
// settings on this device, then hides them from the address bar.
function importSetupFromUrl() {
  try {
    const url = new URL(location.href);
    const k = url.searchParams.get('key'), s = url.searchParams.get('setup');
    if (!k && !s) return;
    if (s) {
      const json = decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/'))));
      const p = JSON.parse(json);
      if (typeof p.k === 'string') gset.apiKey = p.k.trim();
      if (typeof p.h === 'string') gset.homeAddress = p.h;
      if (typeof p.lat === 'number' && typeof p.lng === 'number') { gset.lat = p.lat; gset.lng = p.lng; }
      if (p.u === 'C' || p.u === 'F') gset.units = p.u;
    } else {
      gset.apiKey = k.trim();
    }
    saveGoogleSettings();
    url.searchParams.delete('key'); url.searchParams.delete('setup');
    history.replaceState(null, '', url.pathname + (url.searchParams.toString() ? '?' + url.searchParams.toString() : '') + url.hash);
    setTimeout(() => toast(s ? 'This phone is set up — weather and drive times are on' : 'Google key saved on this device'), 400);
  } catch (e) {}
}

// One function does every request. Google answers errors as JSON: { error: { code, message, status } }.
async function googleFetch(url, init) {
  let res;
  try { res = await fetch(url, init); }
  catch (e) { throw new Error('NETWORK'); }            // no internet, or this host blocks outside connections
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error((data && data.error && data.error.message) || `Google replied with error ${res.status}`);
  return data;
}
// Turn Google's error text into a sentence that says what to do.
function friendlyError(msg) {
  msg = String(msg || '');
  if (msg === 'NETWORK') return 'Couldn’t reach Google from this page. The copy on Claude can’t contact outside services — open the app from your own website address instead. Otherwise check the internet connection.';
  if (/API key not valid|API_KEY_INVALID/i.test(msg)) return 'Google says this key isn’t valid. Check that the whole key was pasted, with no spaces.';
  if (/referer|referrer/i.test(msg)) return 'Google refused this website. In the key’s settings under “Website restrictions”, add this site’s address (for example https://yourname.github.io/*).';
  if (/has not been used|is disabled|not enabled/i.test(msg)) return 'That API isn’t turned on in your Google Cloud project yet. Enable it under APIs & Services → Library, then wait a minute.';
  if (/billing/i.test(msg)) return 'Google Cloud needs a billing account on the project before it will answer (the monthly free amount still applies).';
  if (/quota|RESOURCE_EXHAUSTED|rate limit/i.test(msg)) return 'You’ve reached the usage limit set in Google Cloud for today. It resets tomorrow, or raise the quota.';
  if (/PERMISSION_DENIED|not authorized|blocked/i.test(msg)) return 'Google refused the request: ' + msg;
  return msg;
}

/* --- weather --- */
const WX_BASE = 'https://weather.googleapis.com/v1';

function weatherQuery(lat = gset.lat, lng = gset.lng) {
  return `key=${encodeURIComponent(gset.apiKey)}&location.latitude=${lat}&location.longitude=${lng}&unitsSystem=${unitsSystem()}`;
}
// Google hands the hourly forecast out 24 hours per page; two pages make the 48 hours the event pills use.
async function fetchHours(q) {
  let url = `${WX_BASE}/forecast/hours:lookup?${q}&hours=48&pageSize=24`, all = [];
  for (let page = 0; page < 2 && url; page++) {
    const data = await googleFetch(url);
    all = all.concat(data.forecastHours || []);
    url = data.nextPageToken ? `${WX_BASE}/forecast/hours:lookup?${q}&hours=48&pageSize=24&pageToken=${encodeURIComponent(data.nextPageToken)}` : null;
  }
  return { forecastHours: all };
}
// Ask Google for the weather unless what we have is still fresh. Resolves when the cache is updated.
function refreshWeather(force = false) {
  if (!gset.apiKey || !hasLoc()) return Promise.resolve();
  const loc = `${gset.lat},${gset.lng}`, units = gset.units;
  const w = gcache.weather;
  const same = w && w.loc === loc && w.units === units;
  const fresh = same && w.current && Date.now() - w.at < WEATHER_TTL;
  const failedRecently = same && w.error && Date.now() - (w.errorAt || 0) < ERROR_TTL;
  if (!force && (fresh || failedRecently)) return Promise.resolve();
  if (inflight.weather) return inflight.weather;
  inflight.weather = (async () => {
    const q = weatherQuery();
    try {
      // three answers, asked for at the same time: right now, the next 7 days, the next 48 hours
      const [cur, days, hours] = await Promise.all([
        googleFetch(`${WX_BASE}/currentConditions:lookup?${q}`),
        googleFetch(`${WX_BASE}/forecast/days:lookup?${q}&days=7&pageSize=7`),
        fetchHours(q).catch(() => null),   // hourly detail is a bonus; the daily forecast still works without it
      ]);
      gcache.weather = normalizeWeather(cur, days, hours, loc, units);
    } catch (e) {
      // keep yesterday's answer on screen, but remember that the refresh failed
      gcache.weather = { ...(same ? w : { loc, units, at: 0 }), error: e.message, errorAt: Date.now() };
    }
    saveGoogleCache();
    delete inflight.weather;
    if (current === 'today' || current === 'calendar') render();
    if (current === 'family') updateGStatus();
  })();
  return inflight.weather;
}
// Keep only what the app shows. Field names on the right are Google's; on the left are ours.
function normalizeWeather(cur, days, hours, loc, units) {
  const cond = c => ({ type: c?.weatherCondition?.type || '', text: c?.weatherCondition?.description?.text || '' });
  const d0 = (days.forecastDays || [])[0];
  const current = {
    temp: cur.temperature?.degrees, feels: cur.feelsLikeTemperature?.degrees, ...cond(cur), isDay: cur.isDaytime !== false,
    hum: cur.relativeHumidity, uv: cur.uvIndex, rain: cur.precipitation?.probability?.percent ?? 0,
    wind: cur.wind?.speed?.value, windDir: cur.wind?.direction?.cardinal || '',
    hi: d0?.maxTemperature?.degrees ?? cur.currentConditionsHistory?.maxTemperature?.degrees,
    lo: d0?.minTemperature?.degrees ?? cur.currentConditionsHistory?.minTemperature?.degrees,
    time: cur.currentTime,
  };
  const { days: dayList, hours: hourList } = normalizeForecast(days, hours);
  return { at: Date.now(), loc, units, current, days: dayList, hours: hourList, error: null, errorAt: 0 };
}
// The daily and hourly lists, trimmed to what the app shows (shared by home weather and venue weather).
function normalizeForecast(days, hours) {
  const cond = c => ({ type: c?.weatherCondition?.type || '', text: c?.weatherCondition?.description?.text || '' });
  const dayList = ((days && days.forecastDays) || []).map(d => ({
    date: `${d.displayDate.year}-${pad(d.displayDate.month)}-${pad(d.displayDate.day)}`,
    max: d.maxTemperature?.degrees, min: d.minTemperature?.degrees,
    day: { ...cond(d.daytimeForecast), rain: d.daytimeForecast?.precipitation?.probability?.percent ?? 0 },
    night: { ...cond(d.nighttimeForecast), rain: d.nighttimeForecast?.precipitation?.probability?.percent ?? 0 },
    sunrise: d.sunEvents?.sunriseTime, sunset: d.sunEvents?.sunsetTime,
  }));
  const hourList = ((hours && hours.forecastHours) || []).map(h => ({
    start: Date.parse(h.interval.startTime), end: Date.parse(h.interval.endTime),
    temp: h.temperature?.degrees, ...cond(h), isDay: h.isDaytime !== false, rain: h.precipitation?.probability?.percent ?? 0,
  }));
  return { days: dayList, hours: hourList };
}

/* --- weather at the venue: the route tells us where the event is, so ask Google about that spot too --- */
const VENUE_MAX_PER_SYNC = 3;                 // never more than 3 venue forecasts per refresh
function venueKey(end) { return `${end.lat.toFixed(3)},${end.lng.toFixed(3)}`; }   // 3 decimals ≈ 100 m — the same field, one forecast
function refreshVenueWeather(end, force = false) {
  if (!gset.apiKey || !end) return Promise.resolve();
  const k = venueKey(end), v = (gcache.venues || (gcache.venues = {}))[k], units = gset.units;
  const fresh = v && v.units === units && v.days && Date.now() - v.at < WEATHER_TTL;
  const failedRecently = v && v.error && Date.now() - (v.errorAt || 0) < ERROR_TTL;
  if (!force && (fresh || failedRecently)) return Promise.resolve();
  const ik = 'venue:' + k;
  if (inflight[ik]) return inflight[ik];
  inflight[ik] = (async () => {
    const q = weatherQuery(end.lat, end.lng);
    try {
      const [days, hours] = await Promise.all([
        googleFetch(`${WX_BASE}/forecast/days:lookup?${q}&days=7&pageSize=7`),
        fetchHours(q).catch(() => null),
      ]);
      gcache.venues[k] = { at: Date.now(), units, ...normalizeForecast(days, hours), error: null, errorAt: 0 };
    } catch (e) {
      gcache.venues[k] = { ...(v || { at: 0, units }), error: e.message, errorAt: Date.now() };
    }
    saveGoogleCache();
    delete inflight[ik];

}
// Which icon for which sky. Google reports ~40 condition types; we draw nine.
function wxIcon(type, isDay = true) {

  if (/SNOW|HAIL|BLOWING/.test(t)) return 'wx-snow';
  if (/RAIN|SHOWER/.test(t)) return 'wx-rain';
  if (t === 'WINDY') return 'wx-wind';
  if (t === 'CLOUDY') return 'wx-cloud';
  if (t === 'PARTLY_CLOUDY' || t === 'MOSTLY_CLOUDY') return isDay ? 'wx-partly' : 'wx-partly-night';
  if (t === 'CLEAR' || t === 'MOSTLY_CLEAR') return isDay ? 'sun' : 'wx-moon';
  return isDay ? 'wx-partly' : 'wx-cloud';
}
// The forecast for the hour of an event — at the venue when the route has told us where that is, otherwise at home.
// From the hourly list when the event is within 48h, else from the day's forecast.
function wxForEvent(e) {
  const r = e.address ? gcache.routes[routeKey(e)] : null;
  const venue = r && r.end && gcache.venues ? gcache.venues[venueKey(r.end)] : null;
  const w = venue && venue.days && venue.days.length ? venue : gcache.weather;
  if (!w || !w.days || !w.days.length) return null;
  const at = parseDT(e.date, e.time), ms = at.getTime();
  if (ms < Date.now() - 3600e3) return null;                       // it already happened
  const h = (w.hours || []).find(x => ms >= x.start && ms < x.end);
  if (h && typeof h.temp === 'number') return { temp: h.temp, type: h.type, text: h.text, isDay: h.isDay, rain: h.rain, approx: false, venue: w === venue };
  const d = w.days.find(x => x.date === e.date);
  if (!d) return null;
  const night = at.getHours() >= 19 || at.getHours() < 7;          // Google splits each day at 7 AM and 7 PM
  const part = night ? d.night : d.day;
  const temp = night ? d.min : d.max;
  if (!part || typeof temp !== 'number') return null;
  return { temp, type: part.type, text: part.text, isDay: !night, rain: part.rain, approx: true, venue: w === venue };
}
function wxPill(e) {
  const w = wxForEvent(e);
  if (!w) return '';
  const wet = rainForEvent(e);
  const rain = w.rain >= 30 ? ` <span style="opacity:.8">·</span> ${icon('drop')}${w.rain}%` : '';
  const where = w.venue ? `${icon('marker')}` : '';
  return `<span class="pill wxp${w.venue ? ' venue' : ''}${wet ? ' wet' : ''}" title="${esc(w.text)}${w.venue ? ' at the venue' : ' at home'}${w.approx ? ' (day forecast)' : ''}${wet ? ' · ' + esc(wet.label) : ''}">${where}${icon(wxIcon(w.type, w.isDay))}${Math.round(w.temp)}°${rain}</span>`;

/* --- rain nudges: what a wet forecast means for the event, and for the drive to it --- */
const RAIN_LIKELY = 50;                       // the chance (%) at which the app starts saying "rain likely"
function hoursIn(list, from, to) { return (list || []).filter(x => x.end > from && x.start < to); }

function isWet(h) { return !!h && (h.rain >= RAIN_LIKELY || (wetKind(h) !== 'rain' && h.rain >= 30)); }
function wettest(hours) {                     // the worst hour in a window: storms first, then snow, then the highest rain chance

  for (const h of hours) { const score = (h.rain || 0) + { storm: 300, snow: 200, rain: 0 }[wetKind(h)]; if (!worst || score > worst.score) worst = { ...h, score }; }

// The forecast that applies to the event itself (at the venue when we know it) and the one for the drive (from home).
function forecastsFor(e) {

function weatherStrip() {

  if (!gset.apiKey) return go('Add the weather', 'Paste your Google API key in Family settings');
  if (!hasLoc()) return go('Where’s home?', 'Set a weather location in Family settings', 'nav');

function weatherSheet() {

      <div><b>${typeof c.wind === 'number' ? Math.round(c.wind) : '–'}</b><span>${esc(windU)}${c.windDir ? ' ' + esc(c.windDir.replace(/NORTH/g, 'N').replace(/SOUTH/g, 'S').replace(/EAST/g, 'E').replace(/WEST/g, 'W').replace(/_/g, '')) : ''}</span></div>
      <div><b>${c.uv ?? '–'}</b><span>UV index</span></div>

/* --- drive times --- */
const ROUTES_URL = 'https://routes.googleapis.com/directions/v2:computeRoutes';

function routeKey(e) { return `${gset.homeAddress || `${gset.lat},${gset.lng}`}|${e.placeId || e.address}|${e.date} ${e.time}`; }
// Where the drive ends: the exact place picked from Google's suggestions when there is one, otherwise the typed address.
function destinationOf(e) { return e.placeId ? { placeId: e.placeId } : { address: e.address }; }
// Events worth asking about: in the future, within a week, with an address — nearest first.
function routesNeeded() {

  const now = Date.now();
  return sortedEvents().filter(e => e.address && e.at.getTime() > now && e.at.getTime() - now < ROUTE_HORIZON).slice(0, ROUTE_MAX_PER_SYNC);
}
function refreshRoute(e, force = false) {

  if (!force && r && r.error && Date.now() - (r.errorAt || 0) < ERROR_TTL) return Promise.resolve();
  if (inflight[k]) return inflight[k];
  inflight[k] = (async () => {
    // Ask for traffic as it will be shortly before the event (Google needs a departure time in the future).
    const departure = new Date(Math.max(Date.now() + 2 * 60e3, at - 45 * 60e3)).toISOString();
    const origin = gset.homeAddress ? { address: gset.homeAddress } : { location: { latLng: { latitude: gset.lat, longitude: gset.lng } } };
    const body = { origin, destination: destinationOf(e), travelMode: 'DRIVE', routingPreference: 'TRAFFIC_AWARE', departureTime: departure };
    try {
      // The field mask is the list of answers we want back. Google works out the whole route either way;
      // we ask for the time, the time without traffic, the distance, the route's shape, the turn-by-turn steps
      // and where the trip ends (so the weather can be looked up at the venue).
      const data = await googleFetch(ROUTES_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Goog-Api-Key': gset.apiKey, 'X-Goog-FieldMask': 'routes.duration,routes.staticDuration,routes.distanceMeters,routes.polyline.encodedPolyline,routes.legs.endLocation,routes.legs.steps.navigationInstruction.instructions,routes.legs.steps.distanceMeters,routes.legs.steps.staticDuration' },
        body: JSON.stringify(body),

      const route = (data.routes || [])[0];
      if (!route) throw new Error('Google couldn’t find a driving route to that address.');
      const leg = (route.legs || [])[0] || {};

      const steps = (leg.steps || []).filter(s => s.navigationInstruction && s.navigationInstruction.instructions).map(s => ({ text: s.navigationInstruction.instructions, meters: s.distanceMeters || 0, sec: parseInt(s.staticDuration, 10) || 0 }));

    } catch (err) {

function mapButtons(e) {
  const links = mapsLinks(e);
  return `<div class="mapbtns">
    <a class="mapbtn g" href="${links.google}" target="_blank" rel="noopener" aria-label="Open the route in Google Maps"><img class="mapimg" src="${MAP_TILES.google}" alt=""></a>
    <a class="mapbtn a" href="${links.apple}" target="_blank" rel="noopener" aria-label="Open the route in Apple Maps"><img class="mapimg" src="${MAP_TILES.apple}" alt=""></a>
  </div>`;
}
function directionsHtml(e) {
  if (!gset.apiKey || !hasHome()) return `<p class="hint">Add your Google key and home address in Family settings to get directions.</p>`;
  const r = gcache.routes[routeKey(e)], d = driveInfo(e), links = mapsLinks(e);
  const go = mapButtons(e);
  if (!d) return `<p class="hint">Directions appear during the week before the event.</p>${go}`;
  const head = d.min == null
    ? `<p class="hint">${esc(d.error ? friendlyError(d.error) : d.label)}</p>`
    : `<div class="dirhead"><span class="big${d.tone === 'danger' ? ' late' : ''}">${d.min} min</span><span class="hint">${distanceLabel(d.meters)}${trafficLabel(r)} · ${d.tone === 'danger' ? 'leave now' : 'leave by ' + clock(d.leaveAt)}${esc(rainMinLabel(d))}</span></div>`;
  const map = d.here ? '' : `<div class="routemap" id="routeMap"><p class="hint">${r && r.polyline ? 'Loading the map…' : 'Getting the route…'}</p></div>`;
  const steps = !d.here && r && r.steps && r.steps.length ? `<ol class="steps">${r.steps.map(s => `<li><span>${esc(s.text)}</span><span class="hint">${distanceLabel(s.meters)}</span></li>`).join('')}</ol>` : '';
  return head + nudgeLine(e, { inCard: false }) + go + map + steps;
}
async function mountDirections(e) {
  if (!e || !e.address || !gset.apiKey || !hasHome()) return;
  const at = parseDT(e.date, e.time).getTime();
  if (at < Date.now() || at - Date.now() > ROUTE_HORIZON) return;
  let r = gcache.routes[routeKey(e)];
  if (!r || (!r.polyline && !r.found)) {         // older cache entries have no shape or steps — ask once more (a zero-length "already here" answer is kept)
    await refreshRoute(e, true);
    if (!(sheetKind === 'event' && sheetId === e.id)) return;
    const box = $('#dirBox'); if (box) box.innerHTML = directionsHtml(e);
    r = gcache.routes[routeKey(e)];
  }
  const el = $('#routeMap');
  if (el && r && r.polyline) drawRouteMap(el, r);
}
// Google's map library is loaded the first time a map is needed, with the same key (Maps JavaScript API).
let mapsReady = null;
function loadGoogleMaps() {
  if (window.google && google.maps && google.maps.importLibrary) return Promise.resolve();
  if (mapsReady) return mapsReady;
  mapsReady = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(gset.apiKey)}&v=weekly&loading=async&libraries=geometry&callback=__mapsLoaded`;
    window.__mapsLoaded = () => resolve();
    s.onerror = () => { mapsReady = null; reject(new Error('NETWORK')); };
    document.head.appendChild(s);
    setTimeout(() => reject(new Error('The map took too long to load.')), 15000);
  });
  return mapsReady;
}
async function drawRouteMap(el, r) {
  try {
    await loadGoogleMaps();
    const path = google.maps.geometry.encoding.decodePath(r.polyline);
    el.innerHTML = '';
    const dark = matchMedia('(prefers-color-scheme: dark)').matches;
    const map = new google.maps.Map(el, { disableDefaultUI: true, zoomControl: true, gestureHandling: 'cooperative', colorScheme: dark ? 'DARK' : 'LIGHT', clickableIcons: false });
    new google.maps.Polyline({ path, map, strokeColor: '#2C4FD6', strokeOpacity: .9, strokeWeight: 5 });
    const dot = (pos, color) => new google.maps.Marker({ position: pos, map, icon: { path: google.maps.SymbolPath.CIRCLE, scale: 7, fillColor: color, fillOpacity: 1, strokeColor: '#fff', strokeWeight: 2 } });
    dot(path[0], '#2C4FD6'); dot(path[path.length - 1], '#D34A3E');
    const bounds = new google.maps.LatLngBounds(); path.forEach(p => bounds.extend(p)); map.fitBounds(bounds, 28);
  } catch (e) {
    el.innerHTML = `<p class="hint">The map couldn’t load. ${esc(friendlyError(e.message))}</p>`;
  }
}

/* --- Add a phone: a code that carries the key and settings to another device --- */
function setupLink() {
  const p = { k: gset.apiKey, h: gset.homeAddress, lat: gset.lat, lng: gset.lng, u: gset.units };
  const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(p)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  return `${location.origin}${location.pathname}?setup=${b64}`;
}
function phoneSheet() {
  if (!gset.apiKey) return `<h2 id="sheetTitle">Add a phone</h2><p class="hint">Paste your Google API key first — then this screen can hand it to other phones.</p>`;
  const link = setupLink();

  try { const qr = qrcode(0, 'M'); qr.addData(link); qr.make(); svg = qr.createSvgTag({ cellSize: 4, margin: 6, scalable: true }); } catch (e) { svg = ''; }
  return `<h2 id="sheetTitle">Add a phone</h2>

/* --- address suggestions: as you type an event's address, Google (Places API) offers matching places nearby --- */
const PLACES_URL = 'https://places.googleapis.com/v1/places:autocomplete';
const SUGGEST_MIN = 3;                        // start suggesting at 3 characters
const SUGGEST_DELAY = 350;                    // ...and only after a short pause in typing, so each address costs a handful of requests
const suggestCache = {};                      // what Google said for each thing typed, for this visit
let suggestTimer = null, suggestSeq = 0;

async function fetchSuggestions(input) {
  if (suggestCache[input]) return suggestCache[input];
  const body = { input, includedRegionCodes: ['us'] };
  if (hasLoc()) body.locationBias = { circle: { center: { latitude: gset.lat, longitude: gset.lng }, radius: 50000 } };   // prefer places within ~30 miles of home
  const data = await googleFetch(PLACES_URL, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Goog-Api-Key': gset.apiKey }, body: JSON.stringify(body) });
  const list = (data.suggestions || []).map(s => s.placePrediction).filter(p => p && p.placeId).map(p => ({
    id: p.placeId, text: (p.text && p.text.text) || '',
    main: (p.structuredFormat && p.structuredFormat.mainText && p.structuredFormat.mainText.text) || '',
    sub: (p.structuredFormat && p.structuredFormat.secondaryText && p.structuredFormat.secondaryText.text) || '',
  })).slice(0, 5);
  suggestCache[input] = list;
  return list;
}
function wireAddressSuggest(root) {
  const inp = root.querySelector('#f-address'), pid = root.querySelector('input[name=placeId]');
  if (!inp || !gset.apiKey) return;
  const field = inp.closest('.field'); field.classList.add('suggest');
  const list = document.createElement('ul'); list.className = 'suggest-list'; list.hidden = true; list.setAttribute('role', 'listbox'); field.appendChild(list);
  let items = [], hi = -1;
  const close = () => { list.hidden = true; inp.setAttribute('aria-expanded', 'false'); items = []; hi = -1; };
  const draw = () => {
    if (!items.length) return close();
    list.innerHTML = items.map((s, i) => `<li role="option" data-i="${i}" class="${i === hi ? 'on' : ''}" aria-selected="${i === hi}"><b>${esc(s.main || s.text)}</b>${s.sub ? `<span>${esc(s.sub)}</span>` : ''}</li>`).join('') + '<li class="foot" aria-hidden="true">Suggestions by Google</li>';
    list.hidden = false; inp.setAttribute('aria-expanded', 'true');
  };
  const pick = s => { if (!s) return; inp.value = s.text; if (pid) pid.value = s.id; close(); haptic(6); };
  inp.addEventListener('input', () => {
    if (pid) pid.value = '';                   // typing again means the picked place no longer applies
    const q = inp.value.trim();
    clearTimeout(suggestTimer);
    if (q.length < SUGGEST_MIN) return close();
    const seq = ++suggestSeq;
    suggestTimer = setTimeout(async () => {
      try { const res = await fetchSuggestions(q); if (seq !== suggestSeq) return; items = res; hi = -1; draw(); }
      catch (e) { close(); }                   // no suggestions is not an error worth showing — the typed address still works
    }, SUGGEST_DELAY);
  });
  inp.addEventListener('keydown', e => {
    if (list.hidden) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); hi = (hi + 1) % items.length; draw(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); hi = (hi - 1 + items.length) % items.length; draw(); }
    else if (e.key === 'Enter') { e.preventDefault(); pick(items[hi >= 0 ? hi : 0]); }
    else if (e.key === 'Escape') { e.stopPropagation(); close(); }
  });
  inp.addEventListener('blur', () => setTimeout(close, 150));
  list.addEventListener('pointerdown', e => { const li = e.target.closest('li[data-i]'); if (!li) return; e.preventDefault(); pick(items[Number(li.dataset.i)]); });
}

/* --- keeping things fresh, and the settings box --- */
function syncGoogle() {
  if (!gset.apiKey) return;
  refreshWeather();
  const needed = routesNeeded();
  needed.forEach(e => refreshRoute(e));
  // venue forecasts for the routes we already know the end of (new routes trigger their own when they arrive)
  const seen = new Set();
  needed.forEach(e => {
    const r = gcache.routes[routeKey(e)];
    if (r && r.end && seen.size < VENUE_MAX_PER_SYNC && !seen.has(venueKey(r.end))) { seen.add(venueKey(r.end)); refreshVenueWeather(r.end); }
  });
}
function setGStatus(kind, text) {

function updateGStatus() {

async function testGoogle() {
  if (!gset.apiKey) return setGStatus('bad', 'Paste a key first.');
  if (!hasLoc()) return setGStatus('bad', 'Set the weather location first.');

  setGStatus('busy', `Weather works. Now asking for the drive to “${esc(ev.title)}”…`);
