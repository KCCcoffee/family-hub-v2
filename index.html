<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Hub v2</title>
<meta name="theme-color" content="#F2F1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Family Hub v2">
<style>:root{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* =====================================================================
   FAMILY HUB — styles
   Built around seven mobile-UI ideas:
   1 Navigation   — one bottom tab bar, 5 tabs max, always under the thumb
   2 Scale        — one spacing scale, one type scale, 44px tap targets
   3 Content      — real words and numbers first, decoration last
   4 One job      — every screen does exactly one thing
   5 Gestures     — swipe rows, long-press notes, drag the sheet closed
   6 Dynamism     — the countdown ticks, checks draw, tabs pop, toasts undo
   7 Empty states — an empty list explains itself and offers the next step
   Plus Google services: weather (Weather API), drive times and directions (Routes API), a route map (Maps JavaScript API).
   ===================================================================== */

/* ---------- 2 SCALE: every size in the app comes from these tokens ---------- */
:root {
  /* light palette */
  --bg: #F2F1EC;          /* app ground — warm neutral, leaning toward the marigold accent */
  --bg-outer: #E4E2DA;    /* ground around the phone column on wide screens */
  --surface: #FFFFFF;
  --surface-2: #F7F6F2;
  --line: #E2E0D8;
  --ink: #1B1D25;
  --ink-2: #4A4E5A;
  --muted: #7A7E8A;
  --accent: #2C4FD6;      /* cobalt — the one "do something" color */
  --accent-ink: #FFFFFF;
  --accent-soft: #E3E8FA;
  --sun-a: #F7C453;       /* marigold — reserved for the countdown */
  --sun-b: #F0A92B;
  --sun-ink: #3E2A00;
  --sun-cell: rgba(255,255,255,.55);
  --good: #23935F;  --good-soft: #DCF3E6;
  --warn: #C8690F;
  --danger: #D34A3E; --danger-soft: #FBE3E0;
  --wet: #1E4FB0; --wet-soft: #D6E6FA;   /* rain nudges */
  --note-1: #FFE9A8; --note-2: #D3F1DF; --note-3: #D6E6FA; --note-4: #FBDCE0; --note-5: #E7DCF7;
  --shadow: 0 1px 2px rgba(27,29,37,.06), 0 10px 28px rgba(27,29,37,.10);
  --toast-bg: #1B1D25; --toast-ink: #F2F1EC; --toast-accent: #F7C453;

  /* spacing scale (multiples of 4) */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s7: 32px; --s8: 40px;
  /* type scale */
  --t-xs: 12px; --t-sm: 14px; --t-md: 16px; --t-lg: 18px; --t-xl: 22px; --t-2xl: 28px; --t-3xl: 34px;
  /* shapes and touch */
  --r: 14px; --r-sm: 10px; --r-lg: 20px;
  --tap: 44px;
  --app-w: 430px;
  /* faces */
  --font-display: 'Bricolage Grotesque', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  --font-body: 'Instrument Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  --font-mono: 'DM Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace;
  --font-emoji: 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji', 'Android Emoji', sans-serif;   /* the phone's own emoji, for member pictures */
  /* motion */
  --ease: cubic-bezier(.2,.8,.2,1);
  --dur: 220ms;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161C; --bg-outer: #0D0F13; --surface: #1D2029; --surface-2: #242834; --line: #2F3341;
    --ink: #F1F1F4; --ink-2: #C4C7D1; --muted: #8F94A2;
    --accent: #8AA0F5; --accent-ink: #0E1533; --accent-soft: #263058;
    --sun-a: #5E4614; --sun-b: #7C5A18; --sun-ink: #FFE7A8; --sun-cell: rgba(0,0,0,.28);
    --good: #4FCB8F; --good-soft: #163A27; --warn: #F19A5A; --danger: #F27F75; --danger-soft: #4A1F1C;
    --wet: #9DBAF5; --wet-soft: #1F3358;
    --note-1: #4A3D12; --note-2: #173A2A; --note-3: #1B3150; --note-4: #4A2228; --note-5: #33264A;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 28px rgba(0,0,0,.45);
    --toast-bg: #F1F1F4; --toast-ink: #14161C; --toast-accent: #2C4FD6;
  }
}
:root[data-theme="dark"] {
  --bg: #14161C; --bg-outer: #0D0F13; --surface: #1D2029; --surface-2: #242834; --line: #2F3341;
  --ink: #F1F1F4; --ink-2: #C4C7D1; --muted: #8F94A2;
  --accent: #8AA0F5; --accent-ink: #0E1533; --accent-soft: #263058;
  --sun-a: #5E4614; --sun-b: #7C5A18; --sun-ink: #FFE7A8; --sun-cell: rgba(0,0,0,.28);
  --good: #4FCB8F; --good-soft: #163A27; --warn: #F19A5A; --danger: #F27F75; --danger-soft: #4A1F1C;
  --wet: #9DBAF5; --wet-soft: #1F3358;
  --note-1: #4A3D12; --note-2: #173A2A; --note-3: #1B3150; --note-4: #4A2228; --note-5: #33264A;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 28px rgba(0,0,0,.45);
  --toast-bg: #F1F1F4; --toast-ink: #14161C; --toast-accent: #2C4FD6;
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; }
body {
  margin: 0; min-height: 100%;
  background: var(--bg-outer); color: var(--ink);
  font-family: var(--font-body); font-size: var(--t-md); line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
h1, h2, h3, p { margin: 0; }
svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.grow { flex: 1; min-width: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- 1 NAVIGATION: the phone column, header, tab bar, action button ---------- */
.app { position: relative; max-width: var(--app-w); margin: 0 auto; min-height: 100vh; min-height: 100dvh; background: var(--bg); display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s3);
  padding: calc(var(--s4) + env(safe-area-inset-top, 0px)) var(--s5) var(--s3);
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.topbar .eyebrow { font-size: var(--t-sm); color: var(--muted); font-weight: 500; }
.topbar h1 { font: 700 var(--t-2xl)/1.1 var(--font-display); letter-spacing: -.01em; text-wrap: balance; }
.topbar .sub { font-size: var(--t-sm); color: var(--muted); margin-top: 2px; }
.iconbtn { width: var(--tap); height: var(--tap); border-radius: 50%; display: inline-grid; place-items: center; color: var(--ink-2); flex: none; }
.iconbtn:active { background: var(--surface-2); }
.avstack { display: flex; align-items: center; height: var(--tap); padding: 0 var(--s2); border-radius: 999px; }
.avstack .av { margin-left: -8px; box-shadow: 0 0 0 2px var(--bg); }
.avstack .av:first-child { margin-left: 0; }

main { flex: 1; }
.screen { padding: 0 var(--s4) calc(104px + env(safe-area-inset-bottom, 0px)); }
.screen.enter { animation: rise var(--dur) var(--ease); }
#screen-today.enter { animation-name: fadein; }   /* Today only fades in: a slide would drag its full-screen sky along for a moment */
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

.tabbar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); z-index: 10;
  width: 100%; max-width: var(--app-w);
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--surface); border-top: 1px solid var(--line);
  padding: var(--s1) 0 calc(var(--s1) + env(safe-area-inset-bottom, 0px));
}
.tab { position: relative; min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .01em; border-radius: var(--r-sm); }
.tab .ico { width: 26px; height: 26px; display: grid; place-items: center; }
.tab.on { color: var(--accent); }
.tab.on .ico { animation: pop 320ms var(--ease); }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
.tab .badge { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--danger); color: #fff; font: 600 11px/18px var(--font-body); text-align: center; }

.fab {
  position: fixed; z-index: 9;
  right: max(var(--s4), calc(50% - var(--app-w) / 2 + var(--s4)));
  bottom: calc(80px + env(safe-area-inset-bottom, 0px));
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; box-shadow: var(--shadow);
  transition: transform 160ms var(--ease);
}
.fab:active { transform: scale(.94); }
.fab svg.i { width: 28px; height: 28px; stroke-width: 2.2; }

/* ---------- shared pieces ---------- */
.sec { display: flex; align-items: baseline; justify-content: space-between; margin: var(--s6) 0 var(--s2); }
.sec h2 { font: 600 var(--t-xs)/1 var(--font-body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.sec .link { font-size: var(--t-sm); font-weight: 600; color: var(--accent); min-height: 32px; padding: 0 var(--s2); }
.list { display: flex; flex-direction: column; gap: var(--s2); }
.av { --c: var(--accent); width: 28px; height: 28px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--c); color: #fff; font: 700 12px/1 var(--font-body); flex: none; overflow: hidden; }
.av.av-lg { width: 40px; height: 40px; font-size: 16px; }
.av .pic.emo { font: 400 1.55em/1 var(--font-emoji); display: block; transform: translateY(.03em); }   /* a member's picture: the phone's own emoji in place of the initial… */
.av .pic.art { display: block; width: 100%; height: 100%; }                                              /* …or one of the drawn stickers, filling the circle */
.avs { display: inline-flex; align-items: center; }
.avs .av { width: 22px; height: 22px; font-size: 10px; margin-left: -6px; box-shadow: 0 0 0 2px var(--surface); }
.avs .av:first-child { margin-left: 0; }
.btn { min-height: var(--tap); padding: 0 var(--s5); border-radius: 999px; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); transition: transform 120ms var(--ease); }
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-ghost { border: 1px solid var(--line); color: var(--ink); background: var(--surface); }
.btn-danger { color: var(--danger); background: var(--danger-soft); }
.btn-sm { min-height: 36px; padding: 0 var(--s4); font-size: var(--t-sm); }
.chips { display: flex; gap: var(--s2); overflow-x: auto; padding: 2px 0 var(--s2); scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { min-height: 38px; padding: 0 var(--s3) 0 var(--s2); border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: var(--t-sm); font-weight: 500; display: inline-flex; align-items: center; gap: var(--s2); white-space: nowrap; flex: none; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.on .av { box-shadow: 0 0 0 2px var(--bg); }
.pill { display: inline-flex; align-items: center; min-height: 22px; padding: 0 8px; border-radius: 999px; font-size: var(--t-xs); font-weight: 600; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.sun { background: var(--sun-a); color: var(--sun-ink); }
.pill.danger { background: var(--danger-soft); color: var(--danger); }
.pill.good { background: var(--good-soft); color: var(--good); }

/* ---------- 5 GESTURES: a row is a face that slides over an action underneath ---------- */
.row { position: relative; border-radius: var(--r-sm); overflow: hidden; background: var(--surface); }
.row-under { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 var(--s4); font-weight: 600; font-size: var(--t-sm); color: #fff; opacity: 0; }
.row-under.left { justify-content: flex-start; background: var(--good); }
.row-under.right { justify-content: flex-end; background: var(--danger); }
.row.reveal-right .row-under.left, .row.reveal-left .row-under.right { opacity: 1; }
.row.armed .row-under { font-size: var(--t-md); }
.row-face {
  position: relative; display: flex; align-items: center; gap: var(--s3);
  min-height: 60px; padding: var(--s2) var(--s3); background: var(--surface);
  touch-action: pan-y; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  transition: transform 200ms var(--ease);
}
.row.swiping .row-face { transition: none; }
.row-face .title { font-weight: 500; font-size: var(--t-md); line-height: 1.3; overflow-wrap: anywhere; }
.row-face .meta { display: flex; align-items: center; gap: var(--s2); font-size: 13px; color: var(--muted); margin-top: 3px; }
.row-face .time { font-size: 13px; color: var(--ink-2); width: 62px; flex: none; }
.row.done .title { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.row.leaving { animation: leave 220ms var(--ease) forwards; }
@keyframes leave { to { opacity: 0; transform: translateX(24px); } }

/* the round checkbox — its tick is drawn, not swapped */
.check { width: var(--tap); height: var(--tap); display: grid; place-items: center; flex: none; }
.check .box { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--muted); display: grid; place-items: center; transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease); }
.check svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.check svg path { stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset var(--dur) var(--ease) 60ms; }
.check.on .box { background: var(--good); border-color: var(--good); }
.check.on svg path { stroke-dashoffset: 0; }
.pin { color: var(--muted); }
.pin.on { color: var(--warn); }
.pin.on svg { fill: currentColor; }

/* ---------- Today ---------- */
.count { margin-top: var(--s2); background: linear-gradient(135deg, var(--sun-a), var(--sun-b)); color: var(--sun-ink); border-radius: var(--r-lg); padding: var(--s4) var(--s4) var(--s4); box-shadow: var(--shadow); }
.count .top { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); }
.count .eyebrow { font-size: var(--t-xs); font-weight: 600; letter-spacing: .09em; text-transform: uppercase; opacity: .8; }
.count h2 { font: 700 var(--t-xl)/1.15 var(--font-display); margin-top: var(--s1); text-wrap: balance; }
.count .when { font-size: var(--t-sm); opacity: .85; margin-top: 2px; }
.count .digits { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s2); margin-top: var(--s4); }
.count .d { background: var(--sun-cell); border-radius: var(--r-sm); padding: 10px 2px 8px; text-align: center; }
.count .d b { display: block; font: 500 var(--t-2xl)/1 var(--font-mono); font-variant-numeric: tabular-nums; }
.count .d span { display: block; font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; opacity: .75; margin-top: 4px; }
.count .now { margin-top: var(--s4); font: 600 var(--t-lg) var(--font-display); }
.count .pinbtn { color: var(--sun-ink); opacity: .7; }
.count .pinbtn.on { opacity: 1; }
.count .pinbtn.on svg { fill: currentColor; }
.summary { display: flex; align-items: center; gap: var(--s3); width: 100%; text-align: left; min-height: 64px; padding: var(--s3); border-radius: var(--r-sm); background: var(--surface); }
.summary .ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
.summary .t { font-weight: 600; }
.summary .s { font-size: 13px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.summary .chev { color: var(--muted); }

/* ---------- Weather (Google Weather API) ---------- */
/* The strip sits above the countdown: quiet surface, one glyph, the temperature as the only big number. */
.wx { display: flex; align-items: center; gap: var(--s3); width: 100%; text-align: left; min-height: 76px; padding: var(--s3); margin-top: var(--s2); border-radius: var(--r); background: var(--surface); }
.wx .glyph { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
.wx .glyph svg.i { width: 30px; height: 30px; }
.wx .temp { display: block; font: 700 var(--t-3xl)/1 var(--font-display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.wx .cond { display: block; font-size: var(--t-sm); color: var(--ink-2); margin-top: 3px; }
.wx .side { text-align: right; font-size: 13px; color: var(--muted); line-height: 1.4; flex: none; }
.wx .side b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.wx .side svg.i { width: 13px; height: 13px; vertical-align: -2px; }
.wx.wx-empty .temp { font: 600 var(--t-md)/1.3 var(--font-body); letter-spacing: 0; }
.wx.wx-empty .cond { color: var(--muted); }
.wx .chev { color: var(--muted); flex: none; }
/* small weather / drive-time pills that sit in an event's meta row */
.pill { gap: 4px; }
.pill svg.i { width: 14px; height: 14px; stroke-width: 2; }
.pill.wxp { background: var(--accent-soft); color: var(--accent); }
.pill.drive { background: var(--surface-2); color: var(--ink-2); }
.pill.drive.sun { background: var(--sun-a); color: var(--sun-ink); }
.pill.drive.danger { background: var(--danger); color: #fff; }
.pill.drive.quiet { color: var(--muted); }
.row-face .meta { flex-wrap: wrap; row-gap: 4px; }
/* the "leave by" line inside the countdown card */
.count .drive { display: grid; grid-template-columns: 20px 1fr 18px; column-gap: var(--s2); align-items: center; margin-top: var(--s3); padding: 10px 12px; border-radius: var(--r-sm); background: var(--sun-cell); font-size: var(--t-sm); font-weight: 600; }
.count .drive svg.i { width: 20px; height: 20px; }
.count .drive > svg.i:first-child { grid-column: 1; grid-row: 1 / span 2; }
.count .drive > span { grid-column: 2; }
.count .drive .sub { font-weight: 500; opacity: .8; font-size: 12px; }
.count .drive.late { background: var(--danger); color: #fff; }
.count .drive.late .sub { opacity: .9; }
.count .when .wxin { white-space: nowrap; }
.count .when .wxin svg.i { width: 14px; height: 14px; vertical-align: -2px; }
/* the weather detail sheet */
.wx-hero { display: flex; align-items: center; gap: var(--s4); }
.wx-hero .glyph { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
.wx-hero .glyph svg.i { width: 40px; height: 40px; }
.wx-hero .big { font: 700 56px/1 var(--font-display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.wx-hero .txt { font-size: var(--t-md); color: var(--ink-2); margin-top: 4px; }
.wx-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s2); margin-top: var(--s4); }
.wx-stats div { background: var(--surface-2); border-radius: var(--r-sm); padding: 10px 4px; text-align: center; }
.wx-stats b { display: block; font: 600 var(--t-lg)/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.wx-stats span { display: block; font-size: 10px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
.wx-days { margin-top: var(--s4); border-top: 1px solid var(--line); }
.wx-day { display: grid; grid-template-columns: 82px 28px 1fr auto; align-items: center; gap: var(--s3); min-height: 50px; border-bottom: 1px solid var(--line); font-size: var(--t-sm); }
.wx-day .dn { font-weight: 600; }
.wx-day .dn.today { color: var(--accent); }
.wx-day svg.i { width: 22px; height: 22px; color: var(--ink-2); }
.wx-day .dc { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wx-day .dc small { color: var(--muted); }
.wx-day .hl { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.wx-day .hl span { color: var(--muted); font-weight: 500; }
.wx-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); margin-top: var(--s3); font-size: 12px; color: var(--muted); }
.wx-foot .link { font-size: 13px; font-weight: 600; color: var(--accent); min-height: 36px; padding: 0 var(--s2); }
/* the Google settings box on the Family screen */
.gbox { background: var(--surface); border-radius: var(--r); padding: var(--s3); display: flex; flex-direction: column; gap: var(--s2); }
.gbox .field { margin-bottom: var(--s1); }
.gbox .two { display: grid; grid-template-columns: 1fr auto; gap: var(--s2); align-items: stretch; }
.gbox input.key { font-family: var(--font-mono); font-size: 14px; letter-spacing: .01em; }
.gstatus { display: flex; align-items: flex-start; gap: var(--s2); font-size: 13px; line-height: 1.4; color: var(--ink-2); padding: var(--s2) var(--s3); border-radius: var(--r-sm); background: var(--surface-2); }
.gstatus svg.i { width: 18px; height: 18px; margin-top: 1px; }
.gstatus.ok { color: var(--good); background: var(--good-soft); }
.gstatus.bad { color: var(--danger); background: var(--danger-soft); }
.gstatus.busy svg.i { animation: spin 900ms linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.hint { font-size: 12px; color: var(--muted); line-height: 1.5; }
.hint a { color: var(--accent); font-weight: 600; text-decoration: none; }
/* directions inside an event's sheet: the drive, a Go button, the route map, the steps */
.dirhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.dirhead .big { font: 700 var(--t-2xl)/1 var(--font-display); font-variant-numeric: tabular-nums; }
.dirhead .late { color: var(--danger); }
.routemap { height: 200px; border-radius: var(--r); overflow: hidden; background: var(--surface-2); margin-top: var(--s3); }
.routemap .hint { padding: var(--s3); }
.steps { list-style: none; margin: var(--s3) 0 0; padding: 0; border-top: 1px solid var(--line); counter-reset: step; }
.steps li { display: flex; align-items: flex-start; gap: var(--s3); padding: 10px 4px; border-bottom: 1px solid var(--line); font-size: var(--t-sm); line-height: 1.35; }
.steps li::before { counter-increment: step; content: counter(step); flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font: 600 12px/22px var(--font-body); text-align: center; }
.steps li span { flex: 1; }
.steps li .hint { flex: none; padding-top: 3px; }
.count .drive { cursor: pointer; }
.count .drive .chev { grid-column: 3; grid-row: 1 / span 2; opacity: .7; display: grid; place-items: center; }
.count .drive .chev svg.i { width: 18px; height: 18px; }
.btn { text-decoration: none; }
/* the Add-a-phone code */
.qrbox { display: grid; place-items: center; padding: var(--s3); background: #fff; border-radius: var(--r); margin: var(--s2) 0; }
.qrbox svg { width: 232px; height: 232px; display: block; }
.pill.wxp.venue { background: var(--good-soft); color: var(--good); }
/* rain nudges: a wet forecast for the event or the drive gets its own line, and the pill turns "wet" */
.pill.wxp.wet { background: var(--wet-soft); color: var(--wet); }
.count .nudge { display: flex; align-items: center; gap: var(--s2); margin-top: var(--s2); padding: 8px 12px; border-radius: var(--r-sm); background: var(--sun-cell); font-size: var(--t-sm); }
.count .nudge svg.i { width: 18px; height: 18px; flex: none; }
.count .nudge b { font-weight: 600; }
.count .nudge span { opacity: .85; }
.nudge-row { display: flex; align-items: center; gap: var(--s2); margin-top: var(--s2); padding: 8px 12px; border-radius: var(--r-sm); background: var(--wet-soft); color: var(--wet); font-size: var(--t-sm); }
.nudge-row svg.i { width: 18px; height: 18px; flex: none; }
/* address suggestions under the Address field (Google Places) */
.field.suggest { position: relative; }
.suggest-list { position: absolute; left: 0; right: 0; top: 100%; z-index: 5; margin: 4px 0 0; padding: 4px; list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); box-shadow: var(--shadow); max-height: 220px; overflow: auto; }
.suggest-list li { padding: 9px 10px; border-radius: 8px; font-size: var(--t-sm); cursor: pointer; display: flex; flex-direction: column; gap: 1px; }
.suggest-list li b { font-weight: 600; }
.suggest-list li span { font-size: 12px; color: var(--muted); }
.suggest-list li:hover, .suggest-list li.on { background: var(--surface-2); }
.suggest-list .foot { font-size: 10px; color: var(--muted); padding: 4px 10px 2px; text-align: right; }

/* ---------- Calendar ---------- */
.weeknav { display: flex; align-items: center; justify-content: space-between; margin-top: var(--s2); }
.weeknav h2 { font: 600 var(--t-lg) var(--font-display); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: var(--s1); touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.day { min-height: 66px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px 0; color: var(--ink-2); }
.day .wd { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; opacity: .8; }
.day .num { font: 600 var(--t-lg)/1 var(--font-display); }
.day .dots { display: flex; gap: 3px; height: 5px; }
.day .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--dc, var(--accent)); }
.day.today .num { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.day.sel { background: var(--accent); color: var(--accent-ink); }
.day.sel .dots i { background: currentColor; }
.daylbl { font-size: 13px; font-weight: 600; color: var(--muted); padding: 0 4px 4px; }
.week.slide-left { animation: slideL var(--dur) var(--ease); }
.week.slide-right { animation: slideR var(--dur) var(--ease); }
@keyframes slideL { from { opacity: 0; transform: translateX(24px); } }
@keyframes slideR { from { opacity: 0; transform: translateX(-24px); } }

/* ---------- Grocery ---------- */
.quickadd { display: flex; gap: var(--s2); margin-top: var(--s2); }
.quickadd input { flex: 1; min-width: 0; }
.quickadd .qty { width: 72px; flex: none; }
.quickadd button { width: 48px; flex: none; border-radius: 12px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }

/* ---------- Board ---------- */
.note { --nc: var(--note-1); }
.note .row-face { display: block; background: var(--nc); padding: var(--s4); min-height: 0; }
.note .txt { font-size: var(--t-md); line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
.note .foot { display: flex; align-items: center; gap: var(--s2); margin-top: var(--s3); font-size: 13px; color: var(--ink-2); }
.note .foot .who { font-weight: 600; }
.note .foot .pin { margin-left: auto; width: 36px; height: 36px; }

/* ---------- Family ---------- */
.member { display: grid; grid-template-columns: auto 1fr auto; grid-template-areas: "av name x" "sw sw sw" "pc pc pc"; align-items: center; gap: var(--s2) var(--s3); padding: var(--s3); background: var(--surface); border-radius: var(--r-sm); }
.member > .av { grid-area: av; }
.member input { grid-area: name; min-width: 0; }
.member > .iconbtn { grid-area: x; }
/* one line of colors, with an arrow at its end that opens the picture choices underneath */
.swatches { grid-area: sw; display: flex; align-items: center; gap: var(--s2); padding-left: 52px; }
.swatch { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; }
.swatch.on { border-color: var(--ink); box-shadow: inset 0 0 0 2px var(--surface); }
.morebtn { margin-left: auto; width: 36px; height: 36px; color: var(--muted); }
.morebtn svg.i { transition: transform var(--dur) var(--ease); }
.morebtn[aria-expanded="true"] svg.i { transform: rotate(180deg); }
.morebtn[aria-expanded="true"] { color: var(--ink); }
/* the picture row (hidden until the arrow opens it): the plain initial, then the pictures, each on the member's color */
.pics { grid-area: pc; display: none; flex-wrap: wrap; gap: var(--s2); padding-left: 52px; }
.member.open .pics { display: flex; animation: rise var(--dur) var(--ease); }
.pics .lbl { flex-basis: 100%; font: 600 var(--t-xs)/1 var(--font-body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 6px 0 -2px; }
.pics .lbl:first-child { margin-top: 2px; }
.pics .sub { flex-basis: 100%; font: 500 12px/1 var(--font-body); color: var(--ink-2); margin: 2px 0 -4px; }
.pics button { padding: 0; border-radius: 50%; display: block; }
.pics button .av { width: 36px; height: 36px; font-size: 14px; display: grid; }
.pics button.on { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
.stack { display: flex; flex-direction: column; gap: var(--s2); }
.danger-zone { border: 1px dashed var(--line); border-radius: var(--r); padding: var(--s3); display: flex; flex-direction: column; gap: var(--s2); }
.danger-zone p { font-size: 13px; color: var(--muted); }

/* ---------- 7 EMPTY STATES ---------- */
.empty { text-align: center; padding: var(--s7) var(--s4) var(--s6); }
.empty .glyph { width: 56px; height: 56px; margin: 0 auto; border-radius: 18px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.empty h3 { font: 600 var(--t-lg) var(--font-display); margin-top: var(--s3); text-wrap: balance; }
.empty p { color: var(--muted); font-size: var(--t-sm); max-width: 30ch; margin: var(--s1) auto var(--s4); }
.empty.quiet { padding: var(--s5) var(--s4); }
.empty.quiet .glyph { width: 40px; height: 40px; border-radius: 12px; }

/* ---------- forms in the sheet ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 20; }
.backdrop { position: absolute; inset: 0; background: rgba(10,12,20,.45); opacity: 0; transition: opacity var(--dur) var(--ease); }
.sheet {
  position: absolute; bottom: 0; left: 50%; width: 100%; max-width: var(--app-w);
  max-height: 90vh; max-height: 90dvh; overflow-y: auto;
  background: var(--surface); border-radius: var(--r-lg) var(--r-lg) 0 0;
  padding: 0 var(--s5) calc(var(--s5) + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 104%); transition: transform 260ms var(--ease);
  box-shadow: 0 -8px 40px rgba(0,0,0,.18);
}
.sheet-wrap.open .backdrop { opacity: 1; }
.sheet-wrap.open .sheet { transform: translate(-50%, 0); }
.sheet.dragging { transition: none; }
.handle { position: sticky; top: 0; z-index: 1; padding: 10px 0 6px; background: var(--surface); touch-action: none; cursor: grab; }
.handle i { display: block; width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto; }
.sheet h2 { font: 700 var(--t-xl) var(--font-display); margin: var(--s2) 0 var(--s4); }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: var(--s4); }
.field > label, .field .lbl { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.field .two { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); }
input[type="text"], input[type="date"], input[type="time"], select, textarea {
  width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
  font-size: 16px; /* 16px stops phones from zooming into the field */
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
textarea { min-height: 96px; resize: vertical; line-height: 1.4; }
.who { display: flex; flex-wrap: wrap; gap: var(--s2); }
.who .chip { padding: 0 var(--s3) 0 6px; }
.switch { display: flex; align-items: center; gap: var(--s3); min-height: var(--tap); cursor: pointer; }
.switch input { position: absolute; opacity: 0; width: 0; height: 0; }
.switch .knob { width: 46px; height: 28px; border-radius: 999px; background: var(--line); position: relative; transition: background var(--dur) var(--ease); flex: none; }
.switch .knob::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform var(--dur) var(--ease); }
.switch input:checked + .knob { background: var(--accent); }
.switch input:checked + .knob::after { transform: translateX(18px); }
.switch input:focus-visible + .knob { outline: 3px solid var(--accent); outline-offset: 2px; }
.sheet .actions { display: flex; gap: var(--s2); margin-top: var(--s2); }
.sheet .actions .btn { flex: 1; }
.colorpick { display: flex; gap: var(--s2); }
.colorpick button { width: 36px; height: 36px; border-radius: 50%; border: 2px solid transparent; }
.colorpick button.on { border-color: var(--ink); box-shadow: inset 0 0 0 2px var(--surface); }

/* ---------- 6 DYNAMISM: toast ---------- */
.toast {
  position: fixed; z-index: 30; left: 50%; transform: translate(-50%, 20px);
  bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  width: calc(100% - 32px); max-width: calc(var(--app-w) - 32px);
  display: flex; align-items: center; gap: var(--s3);
  padding: var(--s3) var(--s4); border-radius: var(--r);
  background: var(--toast-bg); color: var(--toast-ink); font-weight: 500; font-size: 15px;
  box-shadow: var(--shadow); opacity: 0; transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast .undo { margin-left: auto; min-height: 36px; padding: 0 var(--s3); border-radius: 999px; font-weight: 700; color: var(--toast-accent); }

/* =====================================================================
   v2 — the two-half home, the capture button, the arc menu, the camera
   ===================================================================== */
/* glass: translucent surfaces with a soft edge highlight (the "Liquid Glass" look, in our colors) */
:root { --glass: rgba(255,255,255,.72); --glass-edge: rgba(255,255,255,.9); --glass-line: rgba(27,29,37,.08); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --glass: rgba(29,32,41,.72); --glass-edge: rgba(255,255,255,.12); --glass-line: rgba(255,255,255,.08); } }
:root[data-theme="dark"] { --glass: rgba(29,32,41,.72); --glass-edge: rgba(255,255,255,.12); --glass-line: rgba(255,255,255,.08); }

/* the bottom bar: four tabs with the capture button rising out of the middle */
.tabbar { grid-template-columns: 1fr 1fr 76px 1fr 1fr; background: var(--glass); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4); border-top: 1px solid var(--glass-line); box-shadow: inset 0 1px 0 var(--glass-edge); }
.tab.spacer { pointer-events: none; }
.capture { position: fixed; z-index: 12; left: 50%; transform: translateX(-50%); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(160deg, #4A6BF0, var(--accent) 60%, #1F3AA8); color: #fff; display: grid; place-items: center; box-shadow: 0 8px 22px rgba(44,79,214,.38), inset 0 1px 0 rgba(255,255,255,.35); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; transition: transform 160ms var(--ease), box-shadow 160ms var(--ease); }
.capture svg.i { width: 30px; height: 30px; stroke-width: 2; }
.capture.held { transform: translateX(-50%) scale(.92); box-shadow: 0 4px 12px rgba(44,79,214,.3), inset 0 1px 0 rgba(255,255,255,.35); }
.capture .hintdot { position: absolute; bottom: 6px; width: 4px; height: 4px; border-radius: 50%; background: rgba(255,255,255,.7); }
/* the arc menu: four options fanned over the top half of the button, drawn only while the thumb is down */
.arc { position: fixed; inset: 0; z-index: 11; display: none; }
.arc.open { display: block; }
.arc .veil { position: absolute; inset: 0; background: rgba(10,12,20,.28); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); animation: fade 160ms var(--ease); }
@keyframes fade { from { opacity: 0; } }
.arc .opt { position: absolute; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 6px 18px rgba(0,0,0,.18), inset 0 1px 0 var(--glass-edge); color: var(--ink); display: grid; place-items: center; transform: scale(.4); opacity: 0; animation: bloom 220ms var(--ease) forwards; }
.arc .opt svg.i { width: 26px; height: 26px; }
.arc .opt .lbl { position: absolute; top: -30px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 12px; font-weight: 600; color: #fff; background: rgba(27,29,37,.85); padding: 4px 9px; border-radius: 999px; opacity: 0; transition: opacity 120ms var(--ease); }
.arc .opt.hot { background: var(--accent); color: var(--accent-ink); transform: scale(1.18) !important; box-shadow: 0 10px 26px rgba(44,79,214,.45); }
.arc .opt.hot .lbl { opacity: 1; }
@keyframes bloom { to { transform: scale(1); opacity: 1; } }
.arc .tip { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(222px + env(safe-area-inset-bottom, 0px)); color: #fff; font-size: 13px; font-weight: 500; opacity: .85; white-space: nowrap; }

/* the camera, full screen inside the app */
.cam { position: fixed; inset: 0; z-index: 40; background: #000; display: none; flex-direction: column; }
.cam.open { display: flex; }
.cam video, .cam canvas.frame { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cam .top { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: calc(12px + env(safe-area-inset-top, 0px)) 12px 12px; z-index: 2; }
.cam .top .iconbtn { color: #fff; background: rgba(0,0,0,.35); backdrop-filter: blur(8px); }
.cam .mode { color: #fff; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; background: rgba(0,0,0,.35); padding: 6px 12px; border-radius: 999px; backdrop-filter: blur(8px); }
.cam .bottom { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 20px 24px calc(28px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, rgba(0,0,0,.55), transparent); }
.cam .shutter { width: 74px; height: 74px; border-radius: 50%; background: #fff; border: 5px solid rgba(255,255,255,.35); background-clip: padding-box; justify-self: center; transition: transform 120ms var(--ease); }
.cam .shutter:active { transform: scale(.9); }
.cam .lens { justify-self: end; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #fff; font-size: 12px; font-weight: 600; }
.cam .lens .ring { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.18); border: 1.5px solid rgba(255,255,255,.7); backdrop-filter: blur(8px); }
.cam .lens .ring svg.i { width: 26px; height: 26px; color: #fff; }
.cam .flip { justify-self: start; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: rgba(255,255,255,.18); backdrop-filter: blur(8px); }
.cam .msg { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; text-align: center; padding: 32px; font-size: 15px; line-height: 1.5; z-index: 1; }
.cam .msg .btn { margin-top: 14px; }
.cam .reticle { position: absolute; left: 50%; top: 50%; width: 220px; height: 150px; transform: translate(-50%, -50%); border: 1.5px dashed rgba(255,255,255,.7); border-radius: 14px; pointer-events: none; z-index: 1; }
.cam .reticle::after { content: "Point at the thing to read"; position: absolute; left: 50%; bottom: -26px; transform: translateX(-50%); color: #fff; font-size: 12px; white-space: nowrap; opacity: .85; }
.cam.flash video { animation: flash 220ms ease-out; }
@keyframes flash { 0% { filter: brightness(2.2); } 100% { filter: none; } }

/* the home screen: the Today view on top, the countdown cards below */
.todayview { transition: max-height 320ms var(--ease), opacity 260ms var(--ease); overflow: hidden; }
.todayview .list { margin-top: 0; }
.todaybar { display: none; align-items: center; gap: var(--s3); width: 100%; text-align: left; margin-top: var(--s2); padding: 10px 14px; border-radius: var(--r); background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: inset 0 1px 0 var(--glass-edge), 0 1px 2px rgba(0,0,0,.05); font-size: var(--t-sm); }
.todaybar b { font-weight: 600; }
.todaybar .wxmini { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-variant-numeric: tabular-nums; }
.todaybar .wxmini svg.i { width: 18px; height: 18px; color: var(--accent); }
.todaybar .chev { color: var(--muted); }
.home.expanded .todayview { max-height: 0 !important; opacity: 0; }
.home.expanded .todaybar { display: flex; animation: rise var(--dur) var(--ease); position: sticky; top: calc(var(--topbar-h, 0px) + 4px); z-index: 4; }
.home.expanded .stackhead { display: none; }
.stackhead { display: flex; align-items: baseline; justify-content: space-between; margin: var(--s4) 0 var(--s2); position: relative; z-index: 1; }

/* ---------- the upper half: a living sky, the greeting and weather straight on it, a weather scene ----------
   The sky is a gradient picked by the time of day (dawn, day, dusk, night — from Google's sunrise and sunset when we have them)
   and tinted by the weather. The greeting, the weather and the Today row sit straight on it. */
:root {
  --sky-dawn-1: #C6D4EE; --sky-dawn-2: #F1D2BE; --sky-dawn-3: #F6C29A;
  --sky-day-1: #6FA6E8;  --sky-day-2: #A8CBF2;  --sky-day-3: #E6EEF7;
  --sky-dusk-1: #8C8CCE; --sky-dusk-2: #DFA3B4; --sky-dusk-3: #F2B385;
  --sky-night-1: #6C7CAB; --sky-night-2: #9AA8CC; --sky-night-3: #CBD4E7;
  --sky-cloud: rgba(255,255,255,.62); --sky-storm-cloud: rgba(70,78,96,.45); --sky-star: rgba(255,255,255,.9);
  --tint-partly: rgba(150,160,178,.14); --tint-cloudy: rgba(140,150,168,.4); --tint-rain: rgba(68,86,114,.42); --tint-storm: rgba(28,32,48,.55); --tint-snow: rgba(232,236,244,.45);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --sky-dawn-1: #191735; --sky-dawn-2: #5C3853; --sky-dawn-3: #C7794D;
  --sky-day-1: #10305E;  --sky-day-2: #27568F;  --sky-day-3: #4A7EBB;
  --sky-dusk-1: #1B163F; --sky-dusk-2: #5A2E5D; --sky-dusk-3: #BD6446;
  --sky-night-1: #05091B; --sky-night-2: #0E1837; --sky-night-3: #1A2A54;
  --sky-cloud: rgba(255,255,255,.14); --sky-storm-cloud: rgba(20,24,36,.6); --sky-star: rgba(255,255,255,.85);
  --tint-partly: rgba(120,130,150,.12); --tint-cloudy: rgba(110,120,140,.35); --tint-rain: rgba(40,52,74,.5); --tint-storm: rgba(10,12,20,.6); --tint-snow: rgba(200,208,224,.18);
} }
:root[data-theme="dark"] {
  --sky-dawn-1: #191735; --sky-dawn-2: #5C3853; --sky-dawn-3: #C7794D;
  --sky-day-1: #10305E;  --sky-day-2: #27568F;  --sky-day-3: #4A7EBB;
  --sky-dusk-1: #1B163F; --sky-dusk-2: #5A2E5D; --sky-dusk-3: #BD6446;
  --sky-night-1: #05091B; --sky-night-2: #0E1837; --sky-night-3: #1A2A54;
  --sky-cloud: rgba(255,255,255,.14); --sky-storm-cloud: rgba(20,24,36,.6); --sky-star: rgba(255,255,255,.85);
  --tint-partly: rgba(120,130,150,.12); --tint-cloudy: rgba(110,120,140,.35); --tint-rain: rgba(40,52,74,.5); --tint-storm: rgba(10,12,20,.6); --tint-snow: rgba(200,208,224,.18);
}
/* The sky fills the whole Today screen — top to bottom, edge to edge — and stays put while everything else scrolls over it.
   (It is pinned to the window, the width of the phone column; the home screen is its own stacking layer so the sky can sit
   underneath all of it, and it disappears with the Today screen when another tab is showing.) */
.home { position: relative; isolation: isolate; }
.todayview { position: relative; z-index: 1; }
.sky { position: fixed; z-index: -1; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: var(--app-w); overflow: hidden; pointer-events: none;
  background: linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 48%, var(--sky-3) 100%); }
.sky.p-dawn  { --sky-1: var(--sky-dawn-1);  --sky-2: var(--sky-dawn-2);  --sky-3: var(--sky-dawn-3); }
.sky.p-day   { --sky-1: var(--sky-day-1);   --sky-2: var(--sky-day-2);   --sky-3: var(--sky-day-3); }
.sky.p-dusk  { --sky-1: var(--sky-dusk-1);  --sky-2: var(--sky-dusk-2);  --sky-3: var(--sky-dusk-3); }
.sky.p-night { --sky-1: var(--sky-night-1); --sky-2: var(--sky-night-2); --sky-3: var(--sky-night-3); }
.sky > i { position: absolute; display: block; }
/* The sun and moon live in the top corners, just under the phone's status bar, so their bright part never sits behind the
   clock, the greeting, the date or the weather line (the words are centered; the corners are the one place nothing is written).
   Their glow is kept short for the same reason. Positions hang off the safe-area inset so a notch doesn't push them onto the words. */
.sky { --sat: env(safe-area-inset-top, 0px); }
.sky .orb { width: 190px; height: 190px; border-radius: 50%; background: radial-gradient(circle, rgba(255,226,130,.95) 0 14%, rgba(255,205,100,.45) 32%, rgba(255,190,90,0) 58%); filter: blur(3px); animation: breathe 7s ease-in-out infinite; }
.sky.p-dawn .orb  { left: -52px; top: calc(var(--sat) - 80px); }                 /* rising: the top-left corner */
.sky.p-day .orb   { right: -52px; top: calc(var(--sat) - 80px); }                /* high: the top-right corner */
.sky.p-dusk .orb  { right: -52px; top: calc(var(--sat) - 80px); background: radial-gradient(circle, rgba(255,205,120,.95) 0 14%, rgba(250,150,90,.5) 32%, rgba(240,120,80,0) 58%); }
.sky.p-night .orb { right: -18px; top: calc(var(--sat) - 44px); width: 130px; height: 130px; background: radial-gradient(circle, rgba(246,244,232,.95) 0 14%, rgba(230,232,240,.3) 32%, rgba(230,232,240,0) 60%); filter: blur(1.5px); }
.sky.k-cloudy .orb, .sky.k-rain .orb, .sky.k-snow .orb { opacity: .4; }
.sky.k-storm .orb { opacity: .18; }
/* eight stars, each its own point, so an opening can bring them out one by one; --st-o is how bright this sky lets them be */
.sky .st { --st-o: 0; width: var(--s, 1.4px); height: var(--s, 1.4px); border-radius: 50%; background: var(--sky-star); opacity: var(--st-o); animation: twinkle 5s ease-in-out infinite calc(var(--i, 0) * -.7s); }
.sky.p-night .st { --st-o: .9; }
.sky.p-dusk .st { --st-o: .35; }
.sky.k-cloudy .st, .sky.k-rain .st, .sky.k-storm .st, .sky.k-snow .st { --st-o: 0; }
/* clouds: each drifts at its own pace and some drift the other way (--dd, --dn), so the sky never looks like it is on a loop;
   every drift starts from the cloud's resting spot, so an opening can hand over to it without a jump */
.sky .cl { height: 80px; width: 260px; border-radius: 999px; background: var(--sky-cloud); filter: blur(16px); opacity: 0; animation: var(--dn, drift) var(--dd, 36s) ease-in-out infinite alternate; }
.sky .cl.c1 { left: -8%; top: calc(var(--sat) + 110px); }
.sky .cl.c2 { right: -10%; top: calc(var(--sat) + 215px); width: 300px; --dd: 48s; --dn: drift-r; }
.sky .cl.c3 { left: 24%; top: calc(var(--sat) + 315px); width: 220px; height: 60px; --dd: 42s; }
.sky .cl.c4 { right: 8%; top: 62%; width: 280px; height: 70px; --dd: 54s; --dn: drift-r; }   /* a low one, behind the cards, so a cloudy sky is cloudy all the way down */
.sky.k-partly .cl.c1, .sky.k-partly .cl.c2 { opacity: .8; }
.sky.k-cloudy .cl, .sky.k-rain .cl, .sky.k-snow .cl, .sky.k-storm .cl, .sky.k-wind .cl { opacity: 1; }
.sky.p-night .cl { background: rgba(255,255,255,.16); }   /* night clouds stay faint, so white words stay readable over them */
.sky.k-rain .cl, .sky.k-storm .cl { background: var(--sky-storm-cloud); }
.sky .tint { inset: 0; }
.sky.k-partly .tint { background: var(--tint-partly); }
.sky.k-cloudy .tint, .sky.k-wind .tint { background: var(--tint-cloudy); }
.sky.k-rain .tint { background: var(--tint-rain); }
.sky.k-storm .tint { background: var(--tint-storm); }
.sky.k-snow .tint { background: var(--tint-snow); }
/* three layers that only show during an opening: a sheet of rain, a flurry of flakes, one flash of lightning */
.sky .rain { inset: -340px 0 0; opacity: 0; background: repeating-linear-gradient(112deg, transparent 0 17px, rgba(255,255,255,.26) 17px 18.4px, transparent 18.4px 30px); }
.sky .snow { left: 0; right: 0; top: -20%; height: 120%; opacity: 0; background-image:
  radial-gradient(2.4px 2.4px at 8% 12%, #fff 60%, transparent), radial-gradient(2px 2px at 22% 40%, #fff 60%, transparent), radial-gradient(2.6px 2.6px at 36% 22%, #fff 60%, transparent), radial-gradient(2px 2px at 48% 58%, #fff 60%, transparent),
  radial-gradient(2.4px 2.4px at 61% 10%, #fff 60%, transparent), radial-gradient(2px 2px at 72% 44%, #fff 60%, transparent), radial-gradient(2.6px 2.6px at 84% 26%, #fff 60%, transparent), radial-gradient(2px 2px at 93% 66%, #fff 60%, transparent),
  radial-gradient(2.2px 2.2px at 15% 78%, #fff 60%, transparent), radial-gradient(2px 2px at 55% 86%, #fff 60%, transparent), radial-gradient(2.4px 2.4px at 78% 80%, #fff 60%, transparent); }
.sky .flash { inset: 0; background: #fff; opacity: 0; }
@keyframes breathe { 50% { transform: scale(1.07); } }
@keyframes twinkle { 50% { opacity: calc(var(--st-o, 1) * .55); } }
@keyframes drift { to { transform: translateX(28px); } }
@keyframes drift-r { to { transform: translateX(-28px); } }

/* ---- The opening: what moves in the second after the app opens (or comes back after a while away).
   The picks follow the data, so the motion tells you what the sky is doing right now:
     dawn  → the sun rises into its corner            day   → the sun brightens into place
     dusk  → the sun sinks into its corner while the first stars come out      night → the moon rises and the stars come out one by one
     partly cloudy → one cloud drifts in from each side   cloudy → the sky greys over and thickens   windy → the clouds blow across
     rain → the clouds roll in and a sheet of rain falls   snow → a flurry drifts down   thunderstorm → the clouds roll in, one soft flash, then the words
   The words rise in line by line, starting almost at once ("Together" timing: the whole opening is done in about a second).
   --f scales every duration, --td is when the words start, --el lets a redraw mid-opening pick up where it was (a negative delay).
   Reduce Motion never gets any of this: the sky is simply there (the JS leaves the "go" classes off, and the rules below back that up). ---- */
.home { --f: 1; --td: 120ms; --el: 0ms; }
.sky.go.o-sky-fade { animation: op-sky-fade calc(450ms * var(--f)) var(--ease) both var(--el); }
@keyframes op-sky-fade { from { opacity: 0; } }
/* the sun or the moon: its slow breathing waits until it has arrived */
.sky.go .orb { animation: var(--orb-anim), breathe 7s ease-in-out infinite calc(var(--orb-dur) + var(--el)); }
.sky.go.o-orb-rise     { --orb-dur: calc(1000ms * var(--f)); --orb-anim: op-orb-rise var(--orb-dur) cubic-bezier(.2,.7,.2,1) both var(--el); }
.sky.go.o-orb-bloom    { --orb-dur: calc(900ms * var(--f));  --orb-anim: op-orb-bloom var(--orb-dur) var(--ease) both var(--el); }
.sky.go.o-orb-dip      { --orb-dur: calc(1200ms * var(--f)); --orb-anim: op-orb-dip var(--orb-dur) ease-in-out both var(--el); }
.sky.go.o-orb-moonrise { --orb-dur: calc(1200ms * var(--f)); --orb-anim: op-orb-moonrise var(--orb-dur) cubic-bezier(.2,.7,.2,1) both var(--el); }
@keyframes op-orb-rise { from { transform: translate(-50px, 130px) scale(.9); opacity: 0; } }       /* up the left edge, mostly off-screen until it reaches its corner */
@keyframes op-orb-bloom { from { transform: scale(.2); opacity: 0; } }
@keyframes op-orb-dip { from { transform: translateY(-70px); } }                                     /* sinks down into the corner, never near the words */
@keyframes op-orb-moonrise { from { transform: translate(44px, 130px); opacity: 0; } }              /* up the right edge, off-screen until it is above the greeting */
/* the stars */
.sky.go.o-stars-sprinkle .st { animation: op-star-in calc(520ms * var(--f)) cubic-bezier(.2,.9,.3,1.2) both calc(var(--i) * 95ms * var(--f) + var(--el)), twinkle 5s ease-in-out infinite calc(var(--i) * 95ms * var(--f) + 600ms + var(--el)); }
.sky.go.o-stars-late .st     { animation: op-star-in calc(520ms * var(--f)) cubic-bezier(.2,.9,.3,1.2) both calc(500ms * var(--f) + var(--i) * 80ms * var(--f) + var(--el)), twinkle 5s ease-in-out infinite calc(var(--i) * 80ms * var(--f) + 1200ms + var(--el)); }
.sky.go.o-stars-fade .st     { animation: op-star-fade calc(800ms * var(--f)) var(--ease) both var(--el), twinkle 5s ease-in-out infinite calc(800ms * var(--f) + var(--el)); }
@keyframes op-star-in { from { opacity: 0; transform: scale(0); } }
@keyframes op-star-fade { from { opacity: 0; } }
/* the clouds: the entrance first, then the slow drift takes over from exactly where the entrance ends */
.sky.go .cl { animation: var(--cl-anim, none), var(--dn, drift) var(--dd, 36s) ease-in-out infinite alternate calc(var(--cl-dur, 0ms) + var(--cl-delay, 0ms) + var(--el)); }
.sky.go.o-wx-driftin .cl.c1 { --cl-dur: calc(950ms * var(--f)); --cl-anim: op-cloud-l var(--cl-dur) var(--ease) both var(--el); }
.sky.go.o-wx-driftin .cl.c2 { --cl-dur: calc(950ms * var(--f)); --cl-anim: op-cloud-r var(--cl-dur) var(--ease) both var(--el); }
.sky.go.o-wx-driftin .cl.c3, .sky.go.o-wx-driftin .cl.c4 { --cl-dur: calc(950ms * var(--f)); --cl-anim: op-cloud-fade var(--cl-dur) var(--ease) both var(--el); }
.sky.go.o-wx-thicken .cl { --cl-dur: calc(1100ms * var(--f)); --cl-anim: op-cloud-fade var(--cl-dur) ease-out both var(--el); }
.sky.go.o-wx-gust .cl { --cl-dur: calc(700ms * var(--f)); --cl-delay: calc(var(--i, 0) * 80ms * var(--f)); --cl-anim: op-gust var(--cl-dur) cubic-bezier(.2,.9,.3,1.25) both calc(var(--cl-delay) + var(--el)); }
.sky.go.o-wx-downpour .cl, .sky.go.o-wx-flash .cl { --cl-dur: calc(800ms * var(--f)); --cl-delay: calc(var(--i, 0) * 120ms * var(--f)); --cl-anim: op-cloud-roll var(--cl-dur) var(--ease) both calc(var(--cl-delay) + var(--el)); }
.sky.go.o-wx-flurry .cl { --cl-dur: calc(900ms * var(--f)); --cl-anim: op-cloud-fade var(--cl-dur) var(--ease) both var(--el); }
@keyframes op-cloud-l { from { transform: translateX(-190px); opacity: 0; } }
@keyframes op-cloud-r { from { transform: translateX(190px); opacity: 0; } }
@keyframes op-cloud-fade { from { opacity: 0; } }
@keyframes op-cloud-roll { from { transform: translateX(-250px); opacity: 0; } }
@keyframes op-gust { 0% { transform: translateX(-320px); opacity: 0; } 70% { transform: translateX(26px); } 100% { transform: none; } }
/* the grey of an overcast, rainy or stormy sky settles in; the rain, the flurry and the flash play once */
.sky.go.o-wx-thicken .tint { animation: op-tint calc(1000ms * var(--f)) ease-out both var(--el); }
.sky.go.o-wx-downpour .tint { animation: op-tint calc(700ms * var(--f)) ease-out both calc(300ms * var(--f) + var(--el)); }
.sky.go.o-wx-flash .tint { animation: op-tint calc(700ms * var(--f)) ease-out both var(--el); }
.sky.go.o-wx-downpour .rain { animation: op-rain calc(1500ms * var(--f)) linear both calc(450ms * var(--f) + var(--el)); }
.sky.go.o-wx-flurry .snow { animation: op-snow calc(2300ms * var(--f)) linear both calc(150ms * var(--f) + var(--el)); }
.sky.go.o-wx-flash .flash { animation: op-flash calc(520ms * var(--f)) linear both calc(720ms * var(--f) + var(--el)); }
@keyframes op-tint { from { opacity: 0; } }
@keyframes op-rain { 0% { opacity: 0; transform: translateY(-300px); } 18% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; transform: none; } }
@keyframes op-snow { 0% { opacity: 0; transform: translateY(-70px); } 15% { opacity: .95; } 85% { opacity: .95; } 100% { opacity: 0; transform: translateY(150px); } }
@keyframes op-flash { 0%, 100% { opacity: 0; } 8% { opacity: .45; } 16% { opacity: .04; } 24% { opacity: .3; } 40% { opacity: 0; } }   /* one soft flash and its echo */
/* the words: each line lifts into place, top to bottom, starting at --td */
.hero.go .hello .clock { --i: 0; } .hero.go .hello h1 { --i: 1; } .hero.go .hello .date { --i: 2; } .hero.go > .wx { --i: 3; } .hero.go .todayfold { --i: 4; }
.hero.go.o-text-rise .hello > *, .hero.go.o-text-rise > .wx, .hero.go.o-text-rise .todayfold { animation: rise calc(440ms * var(--f)) var(--ease) both calc(var(--td) + var(--i, 0) * 75ms * var(--f) + var(--el)); }

/* Everything on the home screen sits straight on the sky: no panel, no box, no shadow — just the words, the weather and the cards over the gradient.
   Dark skies (night, rain, storms — the home screen carries "darksky" then — and every sky in dark mode) get light text with a whisper of shadow;
   light skies keep the app's ink. The tokens live on the home screen so the greeting, the Coming up heading and the empty states all follow the same sky. */
.home { --h-ink: var(--ink); --h-ink-2: var(--ink-2); --h-muted: var(--muted); --h-line: rgba(27,29,37,.14); --h-cell: rgba(255,255,255,.5); --h-link: var(--accent); --h-shadow: none; }
.home.darksky { --h-ink: #fff; --h-ink-2: rgba(255,255,255,.84); --h-muted: rgba(255,255,255,.66); --h-line: rgba(255,255,255,.26); --h-cell: rgba(255,255,255,.14); --h-link: #fff; --h-shadow: 0 1px 2px rgba(0,0,0,.28); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .home { --h-ink: var(--ink); --h-ink-2: var(--ink-2); --h-muted: var(--muted); --h-line: rgba(255,255,255,.16); --h-cell: rgba(255,255,255,.07); --h-shadow: none; } }
:root[data-theme="dark"] .home { --h-ink: var(--ink); --h-ink-2: var(--ink-2); --h-muted: var(--muted); --h-line: rgba(255,255,255,.16); --h-cell: rgba(255,255,255,.07); --h-shadow: none; }
.hero { position: relative; margin-top: calc(var(--s2) + env(safe-area-inset-top, 0px)); padding: var(--s3) var(--s1) 0; color: var(--h-ink); text-shadow: var(--h-shadow); }
.hero .inboxpill { position: absolute; top: 4px; right: 4px; z-index: 2; text-shadow: none; }
/* the greeting block, kept short: a 36px clock, the greeting, the date */
.hello { text-align: center; }
.hello .clock { font: 700 36px/1 var(--font-display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.hello h1 { font: 700 var(--t-xl)/1.15 var(--font-display); letter-spacing: -.01em; margin-top: 3px; text-wrap: balance; }
.hello .date { font-size: var(--t-sm); color: var(--h-ink-2); margin-top: 2px; }
.hero .wx { background: transparent; padding: var(--s1) 0; margin-top: var(--s2); border-radius: 0; min-height: 62px; }
.hero .wx .scene { width: 54px; height: 54px; border-radius: 16px; }
.hero .wx .temp { font-size: 30px; }
.hero .wx .cond, .hero .wx .side { color: var(--h-ink-2); }
.hero .wx .side b { color: var(--h-ink); }
.hero .wx.wx-empty { padding: var(--s2) var(--s1); }
.hero .wx.wx-empty .cond, .hero .wx .chev { color: var(--h-muted); }
/* the Today row: one line that says what the day holds; tap it and the list unfolds underneath */
.todayfold { display: flex; align-items: center; gap: var(--s2); width: 100%; min-height: 44px; padding: 0 var(--s1); margin-top: var(--s1); text-align: left; border-top: 1px solid var(--h-line); }
.todayfold .lbl { font: 600 var(--t-xs)/1 var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--h-muted); }
.todayfold .sum { flex: 1; min-width: 0; font-size: var(--t-sm); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.todayfold .sum small { font-weight: 500; color: var(--h-ink-2); }
.todayfold .chev { color: var(--h-muted); display: grid; place-items: center; transition: transform var(--dur) var(--ease); }
.todayfold[aria-expanded="true"] .chev { transform: rotate(180deg); }
.todaylist { overflow: hidden; max-height: 0; opacity: 0; transition: max-height 320ms var(--ease), opacity 240ms var(--ease); }
.todaylist.open { max-height: 1400px; opacity: 1; }
.todaylist .list { margin-top: var(--s1); }
.hero .row { background: transparent; }
.hero .row-face { background: var(--h-cell); text-shadow: none; }
.hero .empty.quiet { padding: var(--s3) var(--s4) var(--s2); }
.hero .empty.quiet p { color: var(--h-ink-2); }
/* under the unfolded list: the family (avatars → Family settings) on the left, Calendar on the right */
.hero .glassfoot { display: flex; align-items: center; justify-content: space-between; margin-top: var(--s2); text-shadow: none; }
.hero .glassfoot .link { font-size: var(--t-sm); font-weight: 600; color: var(--h-link); min-height: 36px; padding: 0 var(--s2); }
.hero .glassfoot .famlink { height: 36px; padding: 0 var(--s2); font-size: var(--t-sm); font-weight: 600; color: var(--h-link); }
.hero .glassfoot .famlink .av { width: 24px; height: 24px; font-size: 11px; box-shadow: 0 0 0 2px var(--bg); }
.hero .glassfoot .famlink span { margin-left: 10px; }
.topbar.clear { display: none; }

/* the weather scene: a small square of sky whose sun, moon, clouds, rain, snow and lightning match right now */
.scene { --sc-1: var(--sky-day-1); --sc-2: var(--sky-day-3); position: relative; width: 64px; height: 64px; border-radius: 18px; overflow: hidden; flex: none; background: linear-gradient(180deg, var(--sc-1), var(--sc-2)); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 0 0 1px rgba(255,255,255,.18); }
.scene.p-dawn  { --sc-1: var(--sky-dawn-1);  --sc-2: var(--sky-dawn-3); }
.scene.p-dusk  { --sc-1: var(--sky-dusk-1);  --sc-2: var(--sky-dusk-3); }
.scene.p-night { --sc-1: var(--sky-night-1); --sc-2: var(--sky-night-3); }
.scene.k-cloudy, .scene.k-rain, .scene.k-wind { filter: saturate(.7); }
.scene.k-storm { filter: saturate(.6) brightness(.8); }
.scene svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.scene [class^="sc-"] { transform-box: fill-box; transform-origin: center; }
.scene .sc-sun { animation: breathe 5s ease-in-out infinite; }
.scene .sc-rays { animation: spin 70s linear infinite; }
.scene .sc-cloud { animation: sc-drift 6s ease-in-out infinite alternate; }
.scene .sc-cloud.b { animation-duration: 8s; animation-direction: alternate-reverse; }
.scene .sc-drop { animation: sc-fall 1.1s linear infinite; }
.scene .sc-flake { animation: sc-fall 2.8s linear infinite; }

<div class="app" id="app">
  <header class="topbar" id="topbar"></header>
  <main>
    <section class="screen" id="screen-today"></section>
    <section class="screen" id="screen-calendar" hidden></section>
    <section class="screen" id="screen-lists" hidden></section>
    <section class="screen" id="screen-board" hidden></section>
    <section class="screen" id="screen-family" hidden></section>
  </main>
</div>

<nav class="tabbar" id="tabbar" aria-label="Main sections">
  <button class="tab on" data-tab="today" aria-current="page"><span class="ico"><svg class="i"><use href="#i-home"/></svg></span>Today</button>
  <button class="tab" data-tab="calendar"><span class="ico"><svg class="i"><use href="#i-cal"/></svg></span>Calendar</button>
  <span class="tab spacer" aria-hidden="true"></span>
  <button class="tab" data-tab="lists"><span class="ico"><svg class="i"><use href="#i-list"/></svg></span>Lists<span class="badge" id="badge-lists" hidden></span></button>
  <button class="tab" data-tab="board"><span class="ico"><svg class="i"><use href="#i-pin"/></svg></span>Board</button>
</nav>
<!-- the capture button: tap for the camera, hold for the other ways to add -->
<button class="capture" id="capture" aria-label="Capture: tap for the camera, hold for more ways to add" aria-haspopup="menu"><svg class="i"><use href="#i-camera"/></svg><span class="hintdot" aria-hidden="true"></span></button>
<div class="arc" id="arc" aria-hidden="true"><div class="veil"></div><div class="tip" id="arcTip">Slide to an option and let go</div></div>
<!-- the camera, inside the app -->
<div class="cam" id="cam" role="dialog" aria-modal="true" aria-label="Camera">
  <video id="camVideo" autoplay playsinline muted></video>
  <div class="reticle" id="camReticle" hidden></div>
  <div class="msg" id="camMsg" hidden></div>
  <div class="top"><button class="iconbtn" data-act="cam-close" aria-label="Close the camera"><svg class="i"><use href="#i-x"/></svg></button><span class="mode" id="camMode">Photo</span><span style="width:44px"></span></div>
  <div class="bottom">
    <button class="flip" data-act="cam-flip" aria-label="Switch camera"><svg class="i"><use href="#i-flip"/></svg></button>
    <button class="shutter" data-act="cam-shot" aria-label="Take a photo"></button>
    <button class="lens" data-act="cam-lens" aria-label="Lens: read what the camera sees"><span class="ring"><svg class="i"><use href="#i-lens"/></svg></span>Lens</button>
  </div>
  <input type="file" id="camFallback" accept="image/*" capture="environment" hidden>
</div>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="handle" id="handle"><i></i></div>
    <div id="sheetBody"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

/* =====================================================================
   FAMILY HUB — the code, in the order things happen
   1. Data & saving   — what the app remembers (members, events, chores, grocery, notes)
   2. Helpers         — small functions for dates, ids and safe text
   3. Navigation      — the tab bar and switching screens
   4. Screens         — one "render" function per screen
   5. Sheets          — the slide-up form for adding and editing
   6. Gestures        — swipe, long-press and drag-to-close
   7. Dynamism        — the ticking countdown, toasts with Undo, haptics
   8. Google services — weather (Weather API), drive times and directions (Routes API, Maps), address suggestions (Places API)
   9. Boot            — wiring it all together when the page opens
   ===================================================================== */

let state = load();

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(STORAGE_KEY_V1);   // v2 data, else a copy of v1's
    if (raw) { const s = JSON.parse(raw); if (s && Array.isArray(s.members)) { s.captures = s.captures || []; return s; } }
  } catch (e) { /* storage can be unavailable (private mode) — fall through to sample data */ }
  return sampleData();
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* nothing to do — the app still works for this visit */ }

/* ---------- 2. HELPERS ---------- */
const WD  = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const WDS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MOS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

// Text typed by people goes through esc() before it is put into HTML, so "<" can't break the page.
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const member = id => state.members.find(m => m.id === id);
const icon = name => `<svg class="i" aria-hidden="true"><use href="#i-${name}"/></svg>`;

// A member's circle: their picture if they picked one, otherwise their initial, on their color.
function avatar(id, cls = '') {
  const m = member(id);
  if (!m) return '';
  return `<span class="av ${cls}" style="--c:${m.color}" title="${esc(m.name)}">${avatarFace(m)}</span>`;
}
function avatarFace(m, pic = m.pic) {
  const p = pic && MEMBER_PICS.find(x => x.id === pic);
  if (p && p.emoji) return `<span class="pic emo" aria-hidden="true">${p.emoji}</span>`;
  if (p && p.art) return `<svg class="pic art" aria-hidden="true"><use href="#av-${p.id}"/></svg>`;
  return esc(((m.name || '').trim()[0] || '?').toUpperCase());
}
function avatars(ids) { return `<span class="avs">${(ids || []).map(id => avatar(id)).join('')}</span>`; }
function parseDT(date, time) {           // "2026-09-06" + "17:30" -> a real Date in local time
  const [y, mo, d] = date.split('-').map(Number);
  const [h, mi] = (time || '00:00').split(':').map(Number);
  return new Date(y, mo - 1, d, h || 0, mi || 0);
}
function daysFromToday(date) { return Math.round((parseDT(date) - today()) / 86400e3); }
function dayLabel(date) {                // "Today", "Tomorrow", "Thursday", "Sep 18"
  const diff = daysFromToday(date), d = parseDT(date);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Tomorrow';
  if (diff === -1) return 'Yesterday';
  if (diff > 1 && diff < 7) return WD[d.getDay()];
  return `${MOS[d.getMonth()]} ${d.getDate()}`;
}
function longDate(date) { const d = parseDT(date); return `${WD[d.getDay()]}, ${MOS[d.getMonth()]} ${d.getDate()}`; }
function timeLabel(time) {               // "17:30" -> "5:30 PM"
  if (!time) return '';
  let [h, m] = time.split(':').map(Number);
  const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
  return `${h}:${pad(m)} ${ap}`;
}
function clock(ms) {                     // a timestamp -> "5:05 PM"
  const d = new Date(ms);
  return timeLabel(`${d.getHours()}:${pad(d.getMinutes())}`);
}
function inLabel(ms) {                   // how far away something is: "in 3d 4h", "in 25m", "now"
  if (ms < -3600e3) return 'earlier';
  if (ms < 0) return 'now';
  const d = Math.floor(ms / 86400e3), h = Math.floor(ms % 86400e3 / 3600e3), m = Math.floor(ms % 3600e3 / 60e3);
  if (d > 0) return `in ${d}d ${h}h`;
  if (h > 0) return `in ${h}h ${m}m`;
  return `in ${Math.max(1, m)}m`;
}
function ago(ts) {                       // "just now", "5m ago", "2h ago", "3d ago"
  const s = (Date.now() - ts) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  return `${Math.floor(s / 86400)}d ago`;
}
function sortedEvents() {
  return state.events.map(e => ({ ...e, at: parseDT(e.date, e.time) })).sort((a, b) => a.at - b.at);
}
// The event the big countdown follows: a pinned one if it is still relevant, otherwise the next one up.
function featuredEvent() {
  const cutoff = Date.now() - 3600e3;    // an event counts as "happening" for an hour after it starts
  const list = sortedEvents();
  const pinned = list.find(e => e.id === state.featuredEventId && e.at.getTime() > cutoff);
  return pinned || list.find(e => e.at.getTime() > cutoff) || null;
}
function startOfWeek(d) { const x = new Date(d); x.setDate(x.getDate() - x.getDay()); x.setHours(0, 0, 0, 0); return x; }
function greeting() { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; }

// 7 EMPTY STATES: one helper draws every "nothing here yet" so they all feel the same.
function emptyState({ glyph = 'spark', title, body, action, act = '', extra = '', quiet = false }) {

function renderToday() {
  const t = today(), ts = isoDate(t);

  // --- upper half: the Today view — what's happening today, and the weather ---
  const evToday = sortedEvents().filter(e => e.date === ts);
  const choresDue = state.chores.filter(c => !c.done && c.due <= ts).sort((a, b) => a.due.localeCompare(b.due));
  let agenda;
  if (!evToday.length && !choresDue.length) {
    agenda = emptyState({ glyph: 'sun', title: 'A clear day', body: 'No events and no chores due today. Enjoy it.', quiet: true });
  } else {
    agenda = `<div class="list">` + evToday.map(e => eventRow(e, { simple: true })).join('') + choresDue.map(c => choreRow(c)).join('') + `</div>`;
  }
  // the slim bar the Today view shrinks to while a card is open
  const w = gcache.weather && gcache.weather.current;
  const bits = [evToday.length ? `${evToday.length} event${evToday.length === 1 ? '' : 's'}` : '', choresDue.length ? `${choresDue.length} chore${choresDue.length === 1 ? '' : 's'}` : ''].filter(Boolean).join(' · ') || 'a clear day';
  const bar = `<button class="todaybar" data-act="collapse-card" aria-label="Back to the Today view"><span>Today · <b>${bits}</b></span>${w ? `<span class="wxmini">${icon(wxIcon(w.type, w.isDay))}${Math.round(w.temp)}°</span>` : ''}<span class="chev">${icon('down')}</span></button>`;

  // --- lower half: the countdown cards, soonest first (a pinned one jumps to the top) ---
  const cards = upcomingForCards();
  const stack = cards.length
    ? `<div class="cards" id="stack">${cards.map((e, i) => cardHtml(e, i)).join('')}</div>`
    : `<div class="stack-empty">${emptyState({ glyph: 'clock', title: 'Nothing to count down to', body: 'Add an event and its card appears here, counting down.', action: 'Add an event', act: 'data-act="open-sheet" data-kind="event"', quiet: true })}</div>`;
  if (expandedCardId && !cards.some(e => e.id === expandedCardId)) expandedCardId = null;

  // --- the living sky, and the upper half that sits straight on it ---
  const period = skyPeriod(), kind = skyKind(w && w.type);

  const sky = `<div class="sky p-${period} k-${kind}${op ? op.sky : ''}" id="sky" aria-hidden="true">${STARS}<i class="orb"></i><i class="cl c1" style="--i:0"></i><i class="cl c2" style="--i:1"></i><i class="cl c3" style="--i:2"></i><i class="cl c4" style="--i:3"></i><i class="tint"></i><i class="rain"></i><i class="snow"></i><i class="flash"></i></div>`;
  const darkSky = period === 'night' || kind === 'rain' || kind === 'storm';   // light text on these, so the words stay readable

  const fam = familyShort();

      <div class="clock" id="bigclock">${clock(Date.now())}</div>
      <h1>${greeting()}${fam ? `, ${esc(fam)}` : ''}</h1>
      <p class="date">${WD[t.getDay()]}, ${MONTHS[t.getMonth()]} ${t.getDate()}</p>
    </div>`;

  const fold = `<button class="todayfold" data-act="toggle-today" aria-expanded="${todayOpen}" aria-controls="todaylist"><span class="lbl">Today</span><span class="sum">${sum}</span><span class="chev">${icon('down')}</span></button>

        <div class="glassfoot"><button class="avstack famlink" data-act="tab" data-tab="family" aria-label="Family settings">${members || icon('users')}<span>Family</span></button><button class="link" data-act="tab" data-tab="calendar">Calendar</button></div>
      </div>`;

  $('#screen-today').innerHTML = `<div class="home${expandedCardId ? ' expanded' : ''}${darkSky ? ' darksky' : ''}" id="home"${op ? op.style : ''}>
